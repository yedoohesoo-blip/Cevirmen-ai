              private void openBrowserRegionSelector(final boolean saveAsPanel) {
                  if (regionView != null) return;
                  final RectF sel = new RectF();
                  regionView = new View(this) {
                      final Paint dim = new Paint(), box = new Paint(), txt = new Paint(Paint.ANTI_ALIAS_FLAG);
                      { dim.setColor(Color.parseColor("#6607050c")); box.setColor(Color.parseColor(saveAsPanel ? "#34d399" : "#d946ef")); box.setStyle(Paint.Style.STROKE); box.setStrokeWidth(dp(3)); txt.setColor(Color.WHITE); txt.setTextSize(dp(15)); txt.setTextAlign(Paint.Align.CENTER); }
                      @Override protected void onDraw(Canvas c) { c.drawRect(0, 0, getWidth(), getHeight(), dim); if (sel.width() > 5 && sel.height() > 5) c.drawRect(sel, box); else c.drawText(saveAsPanel ? "Kırpılacak paneli seç" : "Çevrilecek alanı seç", getWidth() / 2f, getHeight() / 2f, txt); }
                      float sx, sy;
                      @Override public boolean onTouchEvent(MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) { sx = e.getX(); sy = e.getY(); sel.set(sx, sy, sx, sy); invalidate(); return true; }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) { sel.set(Math.min(sx, e.getX()), Math.min(sy, e.getY()), Math.max(sx, e.getX()), Math.max(sy, e.getY())); invalidate(); return true; }
                          if (e.getAction() == MotionEvent.ACTION_UP) {
                              browserRoot.removeView(regionView); regionView = null;
                              if (sel.width() > 30 && sel.height() > 30) { int[] bLoc = new int[2], rLoc = new int[2]; browserWebView.getLocationInWindow(bLoc); browserRoot.getLocationInWindow(rLoc); int dy = bLoc[1] - rLoc[1]; captureViewportForManga(new Rect((int) sel.left, Math.max(0, (int) sel.top - dy), (int) sel.right, Math.max(10, (int) sel.bottom - dy)), saveAsPanel); }
                              return true;
                          }
                          return false;
                      }
                  };
                  browserRoot.addView(regionView, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
              }

              private void downloadDirectlyToLibrary(final String fileUrl, final String filename, final String ua) {
                  new Thread(() -> {
                      try {
                          HttpURLConnection conn = (HttpURLConnection) new URL(fileUrl).openConnection();
                          String cookies = CookieManager.getInstance().getCookie(fileUrl);
                          if (cookies != null) conn.setRequestProperty("Cookie", cookies);
                          if (ua != null) conn.setRequestProperty("User-Agent", ua);
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          try (InputStream is = conn.getInputStream()) { byte[] buf = new byte[8192]; int n; while ((n = is.read(buf)) > 0) baos.write(buf, 0, n); }
                          final String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                          final String fn64 = Base64.encodeToString(filename.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          runOnUiThread(() -> appWebView.evaluateJavascript("window.__onNativeFileImport && window.__onNativeFileImport('" + fn64 + "','" + b64 + "');", null));
                      } catch (Exception e) { runOnUiThread(() -> Toast.makeText(this, "İndirme hatası: " + e.getMessage(), Toast.LENGTH_LONG).show()); }
                  }).start();
              }

              private void loadInBrowser(String input) {
                  String q = input == null ? "" : input.trim(); if (q.isEmpty()) q = "https://www.google.com";
                  String url = (q.startsWith("http://") || q.startsWith("https://")) ? q : (!q.contains(" ") && q.contains(".")) ? "https://" + q : "https://www.google.com/search?q=" + Uri.encode(q);
                  urlBar.setText(url); browserWebView.loadUrl(url);
              }

              private void captureViewportForManga(final Rect crop, final boolean savePanelOnly) {
                  final int w = browserWebView.getWidth(), h = browserWebView.getHeight(); if (w <= 0 || h <= 0) return;
                  pendingCropRect = crop;
                  if (!savePanelOnly) { statusBar.setText(crop != null ? "✂️ Seçili alan taranıyor…" : "💬 Manga ekranı taranıyor…"); statusBar.setVisibility(View.VISIBLE); }
                  browserWebView.evaluateJavascript("document.querySelectorAll('.cai-mb').forEach(function(e){e.style.visibility='hidden';});", v -> new Handler(Looper.getMainLooper()).postDelayed(() -> doPixelCapture(w, h, crop, savePanelOnly), 80));
              }

              private void doPixelCapture(int w, int h, Rect crop, boolean savePanelOnly) {
                  final Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      int[] loc = new int[2]; browserWebView.getLocationInWindow(loc);
                      try { PixelCopy.request(getWindow(), new Rect(loc[0], loc[1], loc[0] + w, loc[1] + h), bmp, res -> { restoreHiddenBubbles(); if (res == PixelCopy.SUCCESS) processCapturedBitmap(bmp, crop, savePanelOnly); else fallbackCanvasCapture(w, h, crop, savePanelOnly); }, new Handler(Looper.getMainLooper())); }
                      catch (Exception e) { restoreHiddenBubbles(); fallbackCanvasCapture(w, h, crop, savePanelOnly); }
                  } else { restoreHiddenBubbles(); fallbackCanvasCapture(w, h, crop, savePanelOnly); }
              }

              private void fallbackCanvasCapture(int w, int h, Rect crop, boolean savePanelOnly) {
                  try { Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888); Canvas c = new Canvas(bmp); c.translate(-browserWebView.getScrollX(), -browserWebView.getScrollY()); browserWebView.draw(c); processCapturedBitmap(bmp, crop, savePanelOnly); }
                  catch (Exception e) { statusBar.setText("❌ Ekran yakalanamadı: " + e.getMessage()); }
              }
              private void restoreHiddenBubbles() { browserWebView.evaluateJavascript("document.querySelectorAll('.cai-mb').forEach(function(e){e.style.visibility='visible';});", null); }

              private void processCapturedBitmap(Bitmap bmp, Rect crop, boolean savePanelOnly) {
                  try {
                      Bitmap target = bmp;
                      if (crop != null) { int x = Math.max(0, Math.min(crop.left, bmp.getWidth() - 2)), y = Math.max(0, Math.min(crop.top, bmp.getHeight() - 2)), cw = Math.max(2, Math.min(crop.width(), bmp.getWidth() - x)), ch = Math.max(2, Math.min(crop.height(), bmp.getHeight() - y)); target = Bitmap.createBitmap(bmp, x, y, cw, ch); }
                      if (savePanelOnly) { ByteArrayOutputStream baos = new ByteArrayOutputStream(); target.compress(Bitmap.CompressFormat.PNG, 100, baos); saveBytesToDownloads("manga-panel-" + System.currentTimeMillis() + ".png", baos.toByteArray(), "image/png"); return; }
                      lastCapturedBmp = target; int maxW = 1080; Bitmap scaled = target;
                      if (target.getWidth() > maxW) scaled = Bitmap.createScaledBitmap(target, maxW, Math.round((float) target.getHeight() * maxW / target.getWidth()), true);
                      ByteArrayOutputStream baos = new ByteArrayOutputStream(); scaled.compress(Bitmap.CompressFormat.JPEG, 85, baos);
                      appWebView.evaluateJavascript("window.__onNativeMangaCapture && window.__onNativeMangaCapture('" + Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP) + "');", null);
                  } catch (Exception e) { statusBar.setText("❌ Görsel hatası: " + e.getMessage()); }
              }

              private void saveBytesToDownloads(String filename, byte[] bytes, String mimeType) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues cv = new ContentValues(); cv.put(MediaStore.Downloads.DISPLAY_NAME, filename); cv.put(MediaStore.Downloads.MIME_TYPE, mimeType); cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          if (uri != null) try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(bytes); }
                      } else { try (FileOutputStream fos = new FileOutputStream(new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), filename))) { fos.write(bytes); } }
                      Toast.makeText(this, "Kaydedildi: " + filename, Toast.LENGTH_LONG).show();
                  } catch (Exception e) { Toast.makeText(this, "Kayıt hatası: " + e.getMessage(), Toast.LENGTH_LONG).show(); }
              }

              private void triggerPageExtract() {
                  String js = "(function(){"
                      + "var st=window.__caiState;"
                      + "var stale=!st || st.url!==location.href || !st.els.length || !document.contains(st.els[0]);"
                      + "if(stale){"
                      + "  st=window.__caiState={url:location.href,els:[],orig:[],tr:[]};"
                      + "  var skip={SCRIPT:1,STYLE:1,NOSCRIPT:1,SVG:1,NAV:1,HEADER:1,FOOTER:1,BUTTON:1,INPUT:1,TEXTAREA:1,SELECT:1};"
                      + "  var root=document.querySelector('article,main,[role=main],.chapter-content,.cha-words,#chapter-content,.entry-content,.reading-content')||document.body;"
                      + "  var nodes=root.querySelectorAll('p,h1,h2,h3,h4,li,blockquote');"
                      + "  if(nodes.length<3){nodes=document.body.querySelectorAll('p,h1,h2,h3,div');}"
                      + "  var seen=new Set();"
                      + "  for(var i=0;i<nodes.length;i++){"
                      + "    var el=nodes[i];if(skip[el.tagName]||el.closest('nav,header,footer,script,style'))continue;"
                      + "    if(el.tagName==='DIV'&&el.querySelector('p,div'))continue;"
                      + "    var t=(el.innerText||'').replace(/\\s+/g,' ').trim();if(t.length<4||seen.has(el))continue;"
                      + "    seen.add(el);var idx=st.els.length;el.setAttribute('data-cai-id',idx);"
                      + "    st.els.push(el);st.orig.push(el.innerHTML);st.tr.push('');"
                      + "  }"
                      + "}"
                      + "window.__caiSetMode=function(m){for(var i=0;i<st.els.length;i++){var el=st.els[i],tr=st.tr[i];if(!tr||m==='orig'){el.innerHTML=st.orig[i];}else if(m==='bi'){el.innerHTML='<div style=\"opacity:.65;font-size:.88em;margin-bottom:4px\">'+st.orig[i]+'</div><div>'+tr.replace(/</g,'&lt;').replace(/\\n/g,'<br>')+'</div>';}else{el.innerText=tr;}}};"
                      + "window.__caiApply=function(b64,m){try{var bin=atob(b64);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);var map=JSON.parse(new TextDecoder().decode(bytes));for(var k in map){var idx=Number(k);if(st.els[idx]){st.tr[idx]=map[k];}}window.__caiSetMode(m||'tr');}catch(e){}};"
                      + "var h1=(document.querySelector('h1,.chapter-title,.chr-title,h2')?.innerText||'').replace(/\\s+/g,' ').trim();"
                      + "var liveTitle=(h1 && h1.length>2 && h1.length<120) ? h1 : (document.title||location.href);"
                      + "var cov=(document.querySelector('meta[property=\"og:image\"]')?.content)||((document.querySelector('img[src*=\"cover\"],.cover img')?.src))||'';"
                      + "var out=st.els.map(function(el,i){return {i:i,t:(el.innerText||'').replace(/\\s+/g,' ').trim()};});"
                      + "BrowserBridge.onPageExtracted(liveTitle, location.href, cov, JSON.stringify(out));"
                      + "})();";
                  browserWebView.evaluateJavascript(js, null);
              }

              private String enrichBubblesWithColors(String jsonBubbles) {
                  try {
                      JSONArray arr = new JSONArray(jsonBubbles);
                      if (lastCapturedBmp != null) {
                          int bw = lastCapturedBmp.getWidth(), bh = lastCapturedBmp.getHeight();
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject b = arr.optJSONObject(i); if (b == null) continue;
                              double x = b.optDouble("x", 10), y = b.optDouble("y", 10), w = b.optDouble("w", 20), h = b.optDouble("h", 10);
                              double[][] pts = {{x+w*0.5, y+h*0.5}, {x+w*0.2, y+h*0.2}, {x+w*0.8, y+h*0.2}, {x+w*0.2, y+h*0.8}, {x+w*0.8, y+h*0.8}};
                              double lumSum = 0;
                              for (double[] p : pts) {
                                  int c = lastCapturedBmp.getPixel(Math.max(0, Math.min(bw - 1, Math.round((float) (p[0] / 100.0 * bw)))), Math.max(0, Math.min(bh - 1, Math.round((float) (p[1] / 100.0 * bh)))));
                                  lumSum += 0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c);
                              }
                              boolean isLight = (lumSum / pts.length) > 135;
                              b.put("bg", isLight ? "#FFFFFF" : "#120b1f"); b.put("fg", isLight ? "#090612" : "#FFFFFF"); b.put("bd", isLight ? "#1f1433" : "#c084fc");
                          }
                      }
                      return arr.toString();
                  } catch (Exception e) { return jsonBubbles; }
              }

              private class AppBridge {
                  @JavascriptInterface public boolean isNative() { return true; }
                  @JavascriptInterface public boolean isVpnRunning() { return AdBlockVpnService.isRunning; }
                  @JavascriptInterface public void toggleAdVpn() { runOnUiThread(() -> toggleAdGuardVpn()); }

                  @JavascriptInterface public void fetchUrlText(final String reqId, final String targetUrl) {
                      new Thread(() -> {
                          String result = "";
                          try {
                              HttpURLConnection conn = (HttpURLConnection) new URL(targetUrl).openConnection();
                              conn.setRequestProperty("User-Agent", mobileUA);
                              String ck = CookieManager.getInstance().getCookie(targetUrl);
                              if (ck != null) conn.setRequestProperty("Cookie", ck);
                              conn.setConnectTimeout(12000); conn.setReadTimeout(15000);
                              BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                              StringBuilder sb = new StringBuilder(); String line;
                              while ((line = br.readLine()) != null && sb.length() < 200000) sb.append(line).append('\n');
                              result = sb.toString();
                          } catch (Throwable ignored) {}
                          final String b64 = Base64.encodeToString(result.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          runOnUiThread(() -> appWebView.evaluateJavascript("window.__onNativeFetchDone && window.__onNativeFetchDone('" + reqId + "','" + b64 + "');", null));
                      }).start();
                  }

                  @JavascriptInterface public void openBrowser(final String urlOrQuery) { runOnUiThread(() -> { browserRoot.setVisibility(View.VISIBLE); statusBar.setVisibility(View.GONE); curTransMode = "tr"; modeBtn.setText("Çeviri"); updateAdBtnVisual(); loadInBrowser(urlOrQuery); }); }
                  @JavascriptInterface public void setBrowserStatus(final String msg) { runOnUiThread(() -> { if (msg == null || msg.isEmpty()) statusBar.setVisibility(View.GONE); else { statusBar.setText(msg); statusBar.setVisibility(View.VISIBLE); } }); }
                  @JavascriptInterface public void setKeepScreenOn(final boolean on) { runOnUiThread(() -> { if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); }); }
                  @JavascriptInterface public String getClipboardText() { try { ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE); if (cm != null && cm.hasPrimaryClip()) { CharSequence cs = cm.getPrimaryClip().getItemAt(0).coerceToText(MainActivity.this); return cs == null ? "" : cs.toString(); } } catch (Exception ignored) {} return ""; }
                  @JavascriptInterface public void syncConfig(final String jsonCfg) {
                      try {
                          JSONObject j = new JSONObject(jsonCfg);
                          SharedPreferences.Editor ed = getSharedPreferences("cai_cfg", MODE_PRIVATE).edit();
                          ed.putString("apiKey", j.optString("apiKey", "")); ed.putString("baseUrl", j.optString("baseUrl", "https://api.literouter.com/v1"));
                          ed.putString("model", j.optString("model", "")); ed.putString("tgtLang", j.optString("tgtLang", "Türkçe")); ed.apply();
                          mangaFontStyle = j.optString("mangaFont", "system-ui, sans-serif").replace("'", "").replace("\"", "");
                          mangaFontScale = (float) j.optDouble("mangaFontScale", 1.0); mangaBgAlpha = (float) j.optDouble("mangaBgAlpha", 0.98);
                          mangaBorderHex = j.optString("mangaBorder", "#8b5cf6").replace("'", "");
                      } catch (Exception ignored) {}
                  }
                  @JavascriptInterface public void startFloatingOverlay() {
                      runOnUiThread(() -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                              Toast.makeText(MainActivity.this, "Lütfen 'Diğer uygulamaların üzerinde göster' iznini aç.", Toast.LENGTH_LONG).show();
                              startActivityForResult(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())), OVERLAY_REQ); return;
                          }
                          startActivityForResult(((MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE)).createScreenCaptureIntent(), PROJ_REQ);
                      });
                  }
                  @JavascriptInterface public void stopFloatingOverlay() { runOnUiThread(() -> { Intent i = new Intent(MainActivity.this, OverlayService.class); i.setAction("STOP"); startService(i); }); }
                  @JavascriptInterface public void applyPageTranslations(final String jsonMap) { runOnUiThread(() -> { String b64 = Base64.encodeToString(jsonMap.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP); browserWebView.evaluateJavascript("window.__caiApply && window.__caiApply('" + b64 + "','" + curTransMode + "');", null); }); }
                  @JavascriptInterface public void showQuickSelectResult(final String text) { runOnUiThread(() -> { String b64 = Base64.encodeToString((text == null ? "" : text).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP); browserWebView.evaluateJavascript("window.__caiShowQuickTrans && window.__caiShowQuickTrans('" + b64 + "');", null); }); }
                  @JavascriptInterface public void updateSingleMangaBubble(final String id, final String newText) { runOnUiThread(() -> { String b64 = Base64.encodeToString((newText == null ? "" : newText).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP); browserWebView.evaluateJavascript("(function(){var el=document.getElementById('" + id + "');if(!el)return;var bin=atob('" + b64 + "');var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);var t=el.querySelector('.cai-mb-t');if(t)t.textContent=new TextDecoder().decode(bytes);})();", null); }); }
                  @JavascriptInterface public void applyMangaBubbles(final String jsonBubbles) {
                      runOnUiThread(() -> {
                          String b64 = Base64.encodeToString(enrichBubblesWithColors(jsonBubbles).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          float oxPct = 0f, oyPct = 0f, owPct = 100f, ohPct = 100f;
                          if (pendingCropRect != null && browserWebView.getWidth() > 0 && browserWebView.getHeight() > 0) {
                              oxPct = (float) pendingCropRect.left / browserWebView.getWidth() * 100f; oyPct = (float) pendingCropRect.top / browserWebView.getHeight() * 100f;
                              owPct = (float) pendingCropRect.width() / browserWebView.getWidth() * 100f; ohPct = (float) pendingCropRect.height() / browserWebView.getHeight() * 100f;
                          }
                          pendingCropRect = null;
                          String js = "(function(){try{"
                              + "var bin=atob('" + b64 + "');var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);"
                              + "var arr=JSON.parse(new TextDecoder().decode(bytes));"
                              + "var sy=window.scrollY||document.documentElement.scrollTop||0, sx=window.scrollX||document.documentElement.scrollLeft||0;"
                              + "var vw=window.innerWidth||document.documentElement.clientWidth, vh=window.innerHeight||document.documentElement.clientHeight;"
                              + "var ox=" + String.format(Locale.US, "%.3f", oxPct) + "/100*vw, oy=" + String.format(Locale.US, "%.3f", oyPct) + "/100*vh, ow=" + String.format(Locale.US, "%.3f", owPct) + "/100*vw, oh=" + String.format(Locale.US, "%.3f", ohPct) + "/100*vh;"
                              + "var layer=document.getElementById('cai-manga-layer');"
                              + "if(!layer){layer=document.createElement('div');layer.id='cai-manga-layer';layer.style.cssText='position:absolute;top:0;left:0;width:100%;height:0;pointer-events:none;z-index:2147483640;';document.body.appendChild(layer);}"
                              + "arr.forEach(function(b,idx){"
                              + "  var bid='caimb_'+Date.now()+'_'+idx; var d=document.createElement('div'); d.id=bid; d.className='cai-mb';"
                              + "  var rawW=(b.w/100)*ow, rawH=(b.h/100)*oh, bw=Math.max(82,rawW*1.12), bh=Math.max(36,rawH*1.15);"
                              + "  var bx=Math.max(4,sx+ox+(b.x/100)*ow-(bw-rawW)/2), by=Math.max(4,sy+oy+(b.y/100)*oh-(bh-rawH)/2);"
                              + "  var len=Math.max(6,(b.tr||'').length), fs=Math.max(10,Math.min(18,Math.round(Math.sqrt((bw*bh)/len)*0.92*" + String.format(Locale.US, "%.2f", mangaFontScale) + ")));"
                              + "  var bg=b.bg||'#FFFFFF', fg=b.fg||'#090612', bd='2px solid '+(b.bd||'" + mangaBorderHex + "'), rad='14px';"
                              + "  if(b.type==='narration'){bg='#120b1f';fg='#FFFFFF';rad='5px';bd='2px solid #c084fc';}"
                              + "  else if(b.type==='sfx'){bg='#a21caf';fg='#FFFFFF';bd='2px solid #FFFFFF';rad='8px';}"
                              + "  else if(b.type==='thought'){bd='2px dashed #a855f7';rad='20px';}"
                              + "  d.style.cssText='position:absolute;left:'+bx+'px;top:'+by+'px;width:'+bw+'px;min-height:'+bh+'px;background:'+bg+';color:'+fg+';border:'+bd+';border-radius:'+rad+';padding:6px 8px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;font:700 '+fs+'px/1.22 " + mangaFontStyle + ";box-shadow:0 4px 16px rgba(0,0,0,0.55);pointer-events:auto;word-break:break-word;opacity:1;';"
                              + "  var sp=document.createElement('span');sp.className='cai-mb-t';sp.textContent=b.tr;d.appendChild(sp);"
                              + "  var rt=document.createElement('button');rt.textContent='↻';rt.style.cssText='position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;border:none;background:#8b5cf6;color:#fff;font-size:11px;line-height:20px;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);';"
                              + "  rt.onclick=function(ev){ev.stopPropagation();sp.textContent='⏳…';BrowserBridge.onRetranslateBubble(bid,b.orig||b.tr,b.tr);};d.appendChild(rt);"
                              + "  d.onclick=function(){this.style.opacity=this.style.opacity==='0.12'?'1':'0.12';};layer.appendChild(d);"
                              + "});}catch(e){}})();";
                          browserWebView.evaluateJavascript(js, null);
                      });
                  }
