                      + "var out=st.els.map(function(el,i){return {i:i,t:st.origText[i]||(el.innerText||'').replace(/\\s+/g,' ').trim()};});"
                      + "BrowserBridge.onPageExtracted(liveTitle, location.href, cov, JSON.stringify(out), seriesTitle);"
