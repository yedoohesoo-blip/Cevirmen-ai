              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }
              private int overlayType() { return Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE; }
              private GradientDrawable roundBg(int fill, int stroke, int rDp) { GradientDrawable d = new GradientDrawable(); d.setColor(fill); d.setCornerRadius(dp(rDp)); if (stroke != 0) d.setStroke(dp(1), stroke); return d; }
              private void scheduleBubbleDim() { handler.removeCallbacks(dimBubbleRunnable); if (bubbleBtn != null) bubbleBtn.setAlpha(1.0f); handler.postDelayed(dimBubbleRunnable, 3000); }

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null || "STOP".equals(intent.getAction())) { stopSelf(); return START_NOT_STICKY; }
                  startForegroundNotif();
                  int code = intent.getIntExtra("code", Activity.RESULT_CANCELED);
                  Intent data = intent.getParcelableExtra("data");
                  if (data != null && mediaProjection == null) {
                      wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      DisplayMetrics dm = new DisplayMetrics(); wm.getDefaultDisplay().getRealMetrics(dm);
                      screenW = dm.widthPixels; screenH = dm.heightPixels; screenDpi = dm.densityDpi;
                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      mediaProjection = mpm.getMediaProjection(code, data);
                      if (mediaProjection != null) {
                          mediaProjection.registerCallback(new MediaProjection.Callback() { @Override public void onStop() { stopSelf(); } }, handler);
                          imageReader = ImageReader.newInstance(screenW, screenH, PixelFormat.RGBA_8888, 2);
                          imageReader.setOnImageAvailableListener(reader -> {
                              Image img = null;
                              try {
                                  img = reader.acquireLatestImage(); if (img == null) return;
                                  long now = System.currentTimeMillis();
                                  if (!frameWanted && (now - lastCopyMs < 1500)) return;
                                  frameWanted = false; lastCopyMs = now;
                                  Image.Plane[] planes = img.getPlanes(); ByteBuffer buf = planes[0].getBuffer();
                                  int ps = planes[0].getPixelStride(), rs = planes[0].getRowStride(), rp = rs - ps * screenW;
                                  Bitmap raw = Bitmap.createBitmap(screenW + rp / ps, screenH, Bitmap.Config.ARGB_8888);
                                  raw.copyPixelsFromBuffer(buf);
                                  Bitmap clean = Bitmap.createBitmap(raw, 0, 0, screenW, screenH); raw.recycle();
                                  synchronized (frameLock) { if (latestFrame != null && !latestFrame.isRecycled()) latestFrame.recycle(); latestFrame = clean; }
                              } catch (Throwable ignored) {} finally { if (img != null) img.close(); }
                          }, handler);
                          virtualDisplay = mediaProjection.createVirtualDisplay("CevirmenOverlay", screenW, screenH, screenDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader.getSurface(), null, handler);
                          clipMgr = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          if (clipMgr != null) try { clipMgr.addPrimaryClipChangedListener(clipListener); } catch (Throwable ignored) {}
                          showFloatingBubble(); isRunning = true;
                          Toast.makeText(this, "Yüzen Çeviri aktif! Mor 'Ç' topuna dokun.", Toast.LENGTH_SHORT).show();
                      }
                  }
                  return START_NOT_STICKY;
              }

