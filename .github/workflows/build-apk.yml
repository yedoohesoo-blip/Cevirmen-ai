                  @JavascriptInterface public void fetchUrlText(final String reqId, final String targetUrl) {
                      new Thread(() -> {
                          String result = "";
                          try {
                              HttpURLConnection conn = (HttpURLConnection) new URL(targetUrl).openConnection();
                              conn.setInstanceFollowRedirects(true); conn.setRequestProperty("User-Agent", mobileUA);
                              String ck = CookieManager.getInstance().getCookie(targetUrl); if (ck != null) conn.setRequestProperty("Cookie", ck);
                              conn.setConnectTimeout(12000); conn.setReadTimeout(16000);
                              BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8));
                              StringBuilder sb = new StringBuilder(); String line;
                              while ((line = br.readLine()) != null && sb.length() < 350000) sb.append(line).append('\n');
                              result = sb.toString();
                          } catch (Throwable ignored) {}
                          final String b64 = Base64.encodeToString(result.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
