                                      showResultCard("📋 Kopyalanan Metin", out);
                                  });
                              } else if ("ask".equals(action)) {
                                  String out = callAiSimple("Kullanıcının ekran görüntüsüyle ilgili sorusunu net ve Türkçe yanıtla.", promptText, b64);
                                  handler.post(() -> { busy = false; if (bubbleBtn != null) bubbleBtn.setText("Ç"); showResultCard("❓ AI Yanıtı", out); });
                              } else {
                                  String sys = "Görseldeki tüm yazıları/konuşma baloncuklarını tespit et ve hedef dile doğal çevir. "
                                          + "SADECE GEÇERLİ JSON DİZİSİ döndür (markdown ekleme): [{\"x\":10,\"y\":20,\"w\":35,\"h\":10,\"tr\":\"çeviri\"}]. Yazı yoksa [].";
                                  String raw = callAiSimple(sys, "Görseldeki metinleri konumlarıyla çevir.", b64);
