          cat << 'EOF' > android_app/app/src/main/java/com/cevirmen/ai/AdBlockVpnService.java
          package com.cevirmen.ai;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.widget.Toast;

          public class AdBlockVpnService extends VpnService {
              public static volatile boolean isRunning = false;
              private ParcelFileDescriptor vpnInterface = null;

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) { stopVpn(); stopSelf(); return START_NOT_STICKY; }
                  startForegroundVpnNotif(); startVpn(); return START_STICKY;
              }
              private void startForegroundVpnNotif() {
                  try {
                      String chId = "cai_vpn_ch";
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(new NotificationChannel(chId, "AdGuard DNS Kalkanı", NotificationManager.IMPORTANCE_LOW));
                      Intent stopI = new Intent(this, AdBlockVpnService.class); stopI.setAction("STOP");
                      int pFlags = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0;
                      PendingIntent stopPi = PendingIntent.getService(this, 201, stopI, pFlags);
                      Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(this, chId) : new Notification.Builder(this);
                      Notification n = nb.setContentTitle("Çevirmen AI — AdGuard DNS").setContentText("Reklam kalkanı aktif").setSmallIcon(R.drawable.ic_launcher).addAction(android.R.drawable.ic_menu_close_clear_cancel, "Durdur", stopPi).setOngoing(true).build();
                      if (Build.VERSION.SDK_INT >= 34) startForeground(102, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE); else startForeground(102, n);
                  } catch (Throwable ignored) {}
              }
              private void startVpn() {
                  if (vpnInterface != null) return;
                  try {
                      Builder b = new Builder(); b.setSession("Çevirmen AI — AdGuard DNS");
                      b.addAddress("10.111.222.1", 32); b.addRoute("10.111.222.2", 32);
                      b.addDnsServer("94.140.14.14"); b.addDnsServer("94.140.15.15");
                      vpnInterface = b.establish();
                      if (vpnInterface != null) { isRunning = true; MainActivity.notifyVpnState(true); Toast.makeText(this, "🛡️ AdGuard DNS Kalkanı Aktif!", Toast.LENGTH_SHORT).show(); }
                  } catch (Throwable e) { isRunning = false; MainActivity.notifyVpnState(false); Toast.makeText(this, "VPN hatası: " + e.getMessage(), Toast.LENGTH_LONG).show(); }
              }
              private void stopVpn() {
                  isRunning = false; MainActivity.notifyVpnState(false);
                  if (vpnInterface != null) { try { vpnInterface.close(); } catch (Exception ignored) {} vpnInterface = null; }
                  try { stopForeground(true); } catch (Throwable ignored) {}
              }
              @Override public void onDestroy() { stopVpn(); super.onDestroy(); }
              @Override public void onRevoke() { stopVpn(); stopSelf(); super.onRevoke(); }
          }
          EOF

