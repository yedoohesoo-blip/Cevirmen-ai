              private String enrichBubblesWithColors(String jsonBubbles) {
                  try {
                      JSONArray arr = new JSONArray(jsonBubbles);
                      if (lastCapturedBmp != null && !lastCapturedBmp.isRecycled()) {
                          int bw = lastCapturedBmp.getWidth(), bh = lastCapturedBmp.getHeight();
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject b = arr.optJSONObject(i); if (b == null) continue;
                              double x = b.optDouble("x", 10), y = b.optDouble("y", 10), w = b.optDouble("w", 20), h = b.optDouble("h", 10);
                              if (x > 100 || y > 100 || w > 100 || h > 100) { x /= 10.0; y /= 10.0; w /= 10.0; h /= 10.0; b.put("x", x); b.put("y", y); b.put("w", w); b.put("h", h); }
                              double[][] pts = {{x+w*0.12, y+h*0.12}, {x+w*0.88, y+h*0.12}, {x+w*0.12, y+h*0.88}, {x+w*0.88, y+h*0.88}};
                              long rSum = 0, gSum = 0, bSum = 0;
                              for (double[] p : pts) {
                                  int c = lastCapturedBmp.getPixel(Math.max(0, Math.min(bw - 1, Math.round((float)(p[0]/100.0*bw)))), Math.max(0, Math.min(bh - 1, Math.round((float)(p[1]/100.0*bh)))));
                                  rSum += Color.red(c); gSum += Color.green(c); bSum += Color.blue(c);
                              }
                              int r = (int)(rSum/4), g = (int)(gSum/4), bl = (int)(bSum/4);
                              if (0.299*r + 0.587*g + 0.114*bl > 145) { b.put("bg", "#FFFFFF"); b.put("fg", "#090612"); b.put("bd", mangaBorderHex); b.put("halo", "rgba(255,255,255,0.98)"); }
                              else { b.put("bg", "#120a21"); b.put("fg", "#FFFFFF"); b.put("bd", "#c084fc"); b.put("halo", "rgba(18,10,33,0.98)"); }
                          }
                      }
                      return arr.toString();
                  } catch (Exception e) { return jsonBubbles; }
              }

              private void showNativeNotification(String title, String body, String action) {
                  try {
                      String chId = "cai_updates_ch"; NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) nm.createNotificationChannel(new NotificationChannel(chId, "Yeni Bölüm Bildirimleri", NotificationManager.IMPORTANCE_DEFAULT));
                      Intent i = new Intent(this, MainActivity.class); i.putExtra("shortcut", action != null ? action : "notifs"); i.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      int pf = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE) : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pi = PendingIntent.getActivity(this, (int)(System.currentTimeMillis() & 0xffff), i, pf);
                      Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(this, chId) : new Notification.Builder(this);
                      nm.notify((int)(System.currentTimeMillis() % 100000), nb.setContentTitle(title).setContentText(body).setStyle(new Notification.BigTextStyle().bigText(body)).setSmallIcon(R.drawable.ic_launcher).setContentIntent(pi).setAutoCancel(true).build());
                  } catch (Throwable ignored) {}
              }

              private class AppBridge {
                  @JavascriptInterface public boolean isNative() { return true; }
                  @JavascriptInterface public boolean isVpnRunning() { return AdBlockVpnService.isRunning; }
                  @JavascriptInterface public int getBlockedAdCount() { return blockedAdCount; }
                  @JavascriptInterface public void toggleAdVpn() { runOnUiThread(() -> toggleAdGuardVpn()); }
