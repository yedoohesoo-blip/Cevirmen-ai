name: APK Oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları Al
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android Projesini Hazırla
        run: |
          mkdir -p android_app/app/src/main/java/com/cevirmen/ai
          mkdir -p android_app/app/src/main/assets
          mkdir -p android_app/app/src/main/res/drawable
          mkdir -p android_app/app/src/main/res/values
          mkdir -p android_app/app/src/main/res/xml
          cp index.html android_app/app/src/main/assets/index.html
          [ -f core.js ] && cp core.js android_app/app/src/main/assets/core.js || true
          [ -f extras.js ] && cp extras.js android_app/app/src/main/assets/extras.js || true

          cat << 'EOF' > android_app/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CevirmenAI"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat << 'EOF' > android_app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat << 'EOF' > android_app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.cevirmen.ai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cevirmen.ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 10
                  versionName "7.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android_app/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Çevirmen AI</string>
              <string name="sc_resume_short">Son Kitap</string>
              <string name="sc_resume_long">Son Kitaba Devam Et</string>
              <string name="sc_overlay_short">Yüzen Çeviri</string>
              <string name="sc_overlay_long">Yüzen Çeviriyi Başlat</string>
              <string name="sc_chat_short">AI Sohbet</string>
              <string name="sc_chat_long">AI Sohbeti Aç</string>
              <string name="sc_browser_short">Tarayıcı</string>
              <string name="sc_browser_long">Tarayıcıyı Aç</string>
          </resources>
          EOF

          cat << 'EOF' > android_app/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:startX="0" android:startY="0" android:endX="108" android:endY="108" android:type="linear">
                          <item android:offset="0" android:color="#090512"/>
