name: APK Oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları Al
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android Projesini Hazırla
        run: |
          mkdir -p android_app/app/src/main/java/com/cevirmen/ai
          mkdir -p android_app/app/src/main/assets
          mkdir -p android_app/app/src/main/res/drawable
          cp index.html android_app/app/src/main/assets/index.html
          [ -f core.js ] && cp core.js android_app/app/src/main/assets/core.js || true
          [ -f extras.js ] && cp extras.js android_app/app/src/main/assets/extras.js || true

          cat << 'EOF' > android_app/settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CevirmenAI"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat << 'EOF' > android_app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat << 'EOF' > android_app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.cevirmen.ai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cevirmen.ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 6
                  versionName "5.1"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android_app/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:startX="0" android:startY="0" android:endX="108" android:endY="108" android:type="linear">
                          <item android:offset="0" android:color="#090512"/>
                          <item android:offset="1" android:color="#1c0d36"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:pathData="M24,22h60a16,16 0 0,1 16,16v32a16,16 0 0,1 -16,16h-60a16,16 0 0,1 -16,-16v-32a16,16 0 0,1 16,-16z">
                  <aapt:attr name="android:fillColor">
                      <gradient android:startX="16" android:startY="22" android:endX="94" android:endY="86" android:type="linear">
                          <item android:offset="0" android:color="#8b5cf6"/>
                          <item android:offset="1" android:color="#d946ef"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:fillColor="#ffffff" android:pathData="M64,41c-5,-5 -14,-5 -19,0c-6,6 -6,17 0,23c5,5 14,5 19,0l5,5c-8,8 -21,8 -29,0c-9,-9 -9,-24 0,-33c8,-8 21,-8 29,0z"/>
              <path android:fillColor="#fde047" android:pathData="M51,71h7v7h-7z"/>
              <path android:fillColor="#ffffff" android:pathData="M79,30l2,5l5,2l-5,2l-2,5l-2,-5l-5,-2l5,-2z"/>
          </vector>
          EOF

          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Çevirmen AI"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:resizeableActivity="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/cevirmen/ai/OverlayService.java
          package com.cevirmen.ai;

          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.ByteBuffer;
          import java.nio.charset.StandardCharsets;

          public class OverlayService extends Service {
              public static boolean isRunning = false;
              private WindowManager wm;
              private MediaProjection mediaProjection;
              private VirtualDisplay virtualDisplay;
              private ImageReader imageReader;
              private int screenW, screenH, screenDpi;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private volatile Bitmap latestFrame = null;

              private TextView bubbleBtn;
              private WindowManager.LayoutParams bubbleLp;
              private LinearLayout menuBox;
              private FrameLayout resultOverlay;
              private View regionSelector;
              private LinearLayout infoCard;
              private boolean liveMode = false;
              private Rect pinnedRect = null;
              private boolean busy = false;

              private final Runnable liveRunnable = new Runnable() {
                  @Override public void run() {
                      if (!liveMode) return;
                      if (!busy) captureAndAction(pinnedRect, "translate", null);
                      handler.postDelayed(this, 4200);
                  }
              };

              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }
              private int overlayType() {
                  return Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;
              }
              private GradientDrawable roundBg(int fill, int stroke, int rDp) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(fill); d.setCornerRadius(dp(rDp));
                  if (stroke != 0) d.setStroke(dp(1), stroke);
                  return d;
              }

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null || "STOP".equals(intent.getAction())) { stopSelf(); return START_NOT_STICKY; }
                  startForegroundNotif();
                  int code = intent.getIntExtra("code", Activity.RESULT_CANCELED);
                  Intent data = intent.getParcelableExtra("data");
                  if (data != null && mediaProjection == null) {
                      wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      DisplayMetrics dm = new DisplayMetrics();
                      wm.getDefaultDisplay().getRealMetrics(dm);
                      screenW = dm.widthPixels; screenH = dm.heightPixels; screenDpi = dm.densityDpi;
                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      mediaProjection = mpm.getMediaProjection(code, data);
                      if (mediaProjection != null) {
                          mediaProjection.registerCallback(new MediaProjection.Callback() {
                              @Override public void onStop() { stopSelf(); }
                          }, handler);
                          imageReader = ImageReader.newInstance(screenW, screenH, PixelFormat.RGBA_8888, 2);
                          imageReader.setOnImageAvailableListener(reader -> {
                              Image img = null;
                              try {
                                  img = reader.acquireLatestImage();
                                  if (img == null) return;
                                  Image.Plane[] planes = img.getPlanes();
                                  ByteBuffer buf = planes[0].getBuffer();
                                  int ps = planes[0].getPixelStride(), rs = planes[0].getRowStride(), rp = rs - ps * screenW;
                                  Bitmap raw = Bitmap.createBitmap(screenW + rp / ps, screenH, Bitmap.Config.ARGB_8888);
                                  raw.copyPixelsFromBuffer(buf);
                                  Bitmap clean = Bitmap.createBitmap(raw, 0, 0, screenW, screenH);
                                  raw.recycle();
                                  Bitmap old = latestFrame;
                                  latestFrame = clean;
                                  if (old != null && !old.isRecycled()) old.recycle();
                              } catch (Throwable ignored) {
                              } finally {
                                  if (img != null) img.close();
                              }
                          }, handler);
                          virtualDisplay = mediaProjection.createVirtualDisplay(
                                  "CevirmenOverlay", screenW, screenH, screenDpi,
                                  DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                                  imageReader.getSurface(), null, handler);
                          showFloatingBubble();
                          isRunning = true;
                          Toast.makeText(this, "Yüzen Çeviri aktif! Mor 'Ç' topuna dokun.", Toast.LENGTH_SHORT).show();
                      }
                  }
                  return START_NOT_STICKY;
              }

              private void startForegroundNotif() {
                  String chId = "cai_overlay_ch";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(chId, "Yüzen Çeviri", NotificationManager.IMPORTANCE_LOW);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                  }
                  Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, chId) : new Notification.Builder(this);
                  Notification n = nb.setContentTitle("Çevirmen AI — Yüzen Çeviri")
                          .setContentText("Tam ekran, sabit bölge, OCR ve soru-cevap hazır")
                          .setSmallIcon(R.drawable.ic_launcher).build();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)
                      startForeground(101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  else startForeground(101, n);
              }

              private void showFloatingBubble() {
                  if (bubbleBtn != null) return;
                  bubbleBtn = new TextView(this);
                  bubbleBtn.setText("Ç"); bubbleBtn.setTextColor(Color.WHITE); bubbleBtn.setTextSize(19f);
                  bubbleBtn.setGravity(Gravity.CENTER);
                  bubbleBtn.setBackground(roundBg(Color.parseColor("#8b5cf6"), Color.parseColor("#d946ef"), 26));
                  bubbleBtn.setElevation(dp(8));
                  bubbleLp = new WindowManager.LayoutParams(dp(48), dp(48), overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  bubbleLp.gravity = Gravity.TOP | Gravity.START;
                  bubbleLp.x = screenW - dp(60); bubbleLp.y = screenH / 3;

                  bubbleBtn.setOnTouchListener(new View.OnTouchListener() {
                      int ix, iy; float tx, ty; boolean moved;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN: ix = bubbleLp.x; iy = bubbleLp.y; tx = e.getRawX(); ty = e.getRawY(); moved = false; return true;
                              case MotionEvent.ACTION_MOVE:
                                  int dx = (int) (e.getRawX() - tx), dy = (int) (e.getRawY() - ty);
                                  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
                                  bubbleLp.x = ix + dx; bubbleLp.y = iy + dy; wm.updateViewLayout(bubbleBtn, bubbleLp); return true;
                              case MotionEvent.ACTION_UP: if (!moved) toggleMenu(); return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(bubbleBtn, bubbleLp);
              }

              private void toggleMenu() {
                  if (menuBox != null) { removeMenu(); return; }
                  menuBox = new LinearLayout(this);
                  menuBox.setOrientation(LinearLayout.VERTICAL);
                  menuBox.setBackground(roundBg(Color.parseColor("#F5110b1c"), Color.parseColor("#8b5cf6"), 16));
                  menuBox.setPadding(dp(10), dp(10), dp(10), dp(10));

                  addMenuBtn("🖼️ Tam Ekran Çevir", "#8b5cf6", v -> { removeMenu(); captureAndAction(null, "translate", null); });
                  addMenuBtn("✂️ Bölge Seç & Çevir", "#a855f7", v -> { removeMenu(); openRegionSelector(false); });
                  addMenuBtn(pinnedRect != null && liveMode ? "⏹ Sabit Bölgeyi Durdur" : "📌 Sabit Bölge Oto-Çevir",
                          pinnedRect != null && liveMode ? "#f43f5e" : "#6d28d9", v -> {
                      removeMenu();
                      if (pinnedRect != null && liveMode) {
                          liveMode = false; pinnedRect = null; handler.removeCallbacks(liveRunnable); clearResults();
                          Toast.makeText(this, "Sabit bölge durduruldu", Toast.LENGTH_SHORT).show();
                      } else { openRegionSelector(true); }
                  });
                  addMenuBtn(liveMode && pinnedRect == null ? "⏹ Canlı Çeviriyi Durdur" : "⚡ Canlı Tam Ekran (Oto)",
                          liveMode && pinnedRect == null ? "#f43f5e" : "#1a1229", v -> {
                      removeMenu();
                      if (liveMode && pinnedRect == null) { liveMode = false; handler.removeCallbacks(liveRunnable); clearResults(); }
                      else { pinnedRect = null; liveMode = true; handler.post(liveRunnable); }
                  });
                  addMenuBtn("📋 Ekrandaki Metni Kopyala", "#1a1229", v -> { removeMenu(); captureAndAction(null, "copy", null); });
                  addMenuBtn("❓ Ekrana Soru Sor", "#1a1229", v -> { removeMenu(); openAskDialog(); });
                  addMenuBtn("📎 Panoyu Çevir", "#1a1229", v -> { removeMenu(); translateClipboardNow(); });
                  addMenuBtn("🧹 Temizle", "#1a1229", v -> { removeMenu(); clearResults(); removeInfoCard(); });
                  addMenuBtn("✕ Yüzen Çeviriyi Kapat", "#3b1224", v -> { removeMenu(); stopSelf(); });

                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          dp(225), WindowManager.LayoutParams.WRAP_CONTENT, overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.CENTER;
                  wm.addView(menuBox, lp);
              }

              private void addMenuBtn(String txt, String bgHex, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(txt); b.setAllCaps(false); b.setTextColor(Color.WHITE); b.setTextSize(12.5f);
                  b.setBackground(roundBg(Color.parseColor(bgHex), Color.parseColor("#2a1f3d"), 10));
                  b.setPadding(dp(10), dp(5), dp(10), dp(5)); b.setMinHeight(0); b.setMinimumHeight(dp(36));
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, dp(2), 0, dp(2));
                  menuBox.addView(b, lp);
              }

              private void removeMenu() { if (menuBox != null) { try { wm.removeView(menuBox); } catch (Exception ignored) {} menuBox = null; } }
              private void clearResults() { if (resultOverlay != null) { try { wm.removeView(resultOverlay); } catch (Exception ignored) {} resultOverlay = null; } }
              private void removeInfoCard() { if (infoCard != null) { try { wm.removeView(infoCard); } catch (Exception ignored) {} infoCard = null; } }

              private void openAskDialog() {
                  removeInfoCard();
                  infoCard = new LinearLayout(this);
                  infoCard.setOrientation(LinearLayout.VERTICAL);
                  infoCard.setBackground(roundBg(Color.parseColor("#F5110b1c"), Color.parseColor("#8b5cf6"), 16));
                  infoCard.setPadding(dp(14), dp(14), dp(14), dp(14));

                  TextView title = new TextView(this);
                  title.setText("❓ Ekrandaki Görüntüye Soru Sor"); title.setTextColor(Color.parseColor("#c084fc")); title.setTextSize(14f);
                  EditText inp = new EditText(this);
                  inp.setHint("Örn: Bu ekranda ne yazıyor?"); inp.setHintTextColor(Color.parseColor("#9a8fb0")); inp.setTextColor(Color.WHITE);
                  inp.setBackground(roundBg(Color.parseColor("#1a1229"), Color.parseColor("#2a1f3d"), 10));
                  inp.setPadding(dp(10), dp(8), dp(10), dp(8));

                  LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
                  Button ask = new Button(this); ask.setText("Sor"); ask.setTextColor(Color.WHITE); ask.setBackground(roundBg(Color.parseColor("#8b5cf6"), 0, 10));
                  ask.setOnClickListener(v -> {
                      String q = inp.getText().toString().trim(); removeInfoCard();
                      captureAndAction(null, "ask", q.isEmpty() ? "Bu ekrandaki içeriği özetle ve açıkla." : q);
                  });
                  Button cancel = new Button(this); cancel.setText("İptal"); cancel.setTextColor(Color.WHITE); cancel.setBackground(roundBg(Color.parseColor("#2a1f3d"), 0, 10));
                  cancel.setOnClickListener(v -> removeInfoCard());
                  row.addView(ask, new LinearLayout.LayoutParams(0, dp(38), 1f));
                  row.addView(cancel, new LinearLayout.LayoutParams(dp(80), dp(38)));

                  infoCard.addView(title);
                  LinearLayout.LayoutParams lpI = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lpI.setMargins(0, dp(8), 0, dp(10));
                  infoCard.addView(inp, lpI); infoCard.addView(row);

                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(dp(300), WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType(), WindowManager.LayoutParams.FLAG_DIM_BEHIND, PixelFormat.TRANSLUCENT);
                  lp.dimAmount = 0.5f; lp.gravity = Gravity.CENTER;
                  wm.addView(infoCard, lp);
              }

              private void showResultCard(String titleTxt, String bodyTxt) {
                  removeInfoCard();
                  infoCard = new LinearLayout(this);
                  infoCard.setOrientation(LinearLayout.VERTICAL);
                  infoCard.setBackground(roundBg(Color.parseColor("#F5110b1c"), Color.parseColor("#8b5cf6"), 16));
                  infoCard.setPadding(dp(14), dp(14), dp(14), dp(14));

                  TextView t = new TextView(this); t.setText(titleTxt); t.setTextColor(Color.parseColor("#c084fc")); t.setTextSize(14f);
                  ScrollView sv = new ScrollView(this);
                  TextView b = new TextView(this); b.setText(bodyTxt); b.setTextColor(Color.WHITE); b.setTextSize(14f); b.setPadding(0, dp(8), 0, dp(8));
                  sv.addView(b);

                  LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
                  Button cp = new Button(this); cp.setText("Kopyala"); cp.setTextColor(Color.WHITE); cp.setBackground(roundBg(Color.parseColor("#8b5cf6"), 0, 10));
                  cp.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("CevirmenAI", bodyTxt));
                      Toast.makeText(this, "Panoya kopyalandı", Toast.LENGTH_SHORT).show();
                  });
                  Button cl = new Button(this); cl.setText("Kapat"); cl.setTextColor(Color.WHITE); cl.setBackground(roundBg(Color.parseColor("#2a1f3d"), 0, 10));
                  cl.setOnClickListener(v -> removeInfoCard());
                  row.addView(cp, new LinearLayout.LayoutParams(0, dp(38), 1f));
                  row.addView(cl, new LinearLayout.LayoutParams(dp(80), dp(38)));

                  infoCard.addView(t);
                  infoCard.addView(sv, new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(230)));
                  infoCard.addView(row);

                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(dp(315), WindowManager.LayoutParams.WRAP_CONTENT,
                          overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.CENTER;
                  wm.addView(infoCard, lp);
              }

              private void translateClipboardNow() {
                  try {
                      ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                      if (cm == null || !cm.hasPrimaryClip()) { Toast.makeText(this, "Pano boş", Toast.LENGTH_SHORT).show(); return; }
                      CharSequence cs = cm.getPrimaryClip().getItemAt(0).coerceToText(this);
                      final String txt = cs == null ? "" : cs.toString().trim();
                      if (txt.isEmpty()) { Toast.makeText(this, "Pano boş", Toast.LENGTH_SHORT).show(); return; }
                      if (bubbleBtn != null) bubbleBtn.setText("⏳");
                      new Thread(() -> {
                          try {
                              String out = callAiSimple("Kullanıcı metnini hedef dile doğal ve akıcı çevir. Sadece çeviriyi yaz.", txt, null);
                              handler.post(() -> { if (bubbleBtn != null) bubbleBtn.setText("Ç"); showResultCard("📎 Pano Çevirisi", out); });
                          } catch (Throwable e) {
                              handler.post(() -> { if (bubbleBtn != null) bubbleBtn.setText("Ç"); Toast.makeText(this, "Hata: " + e.getMessage(), Toast.LENGTH_LONG).show(); });
                          }
                      }).start();
                  } catch (Exception e) { Toast.makeText(this, "Panoya erişilemedi", Toast.LENGTH_SHORT).show(); }
              }

              private void openRegionSelector(final boolean pinForAuto) {
                  if (regionSelector != null) return;
                  final RectF sel = new RectF();
                  regionSelector = new View(this) {
                      final Paint dim = new Paint(), box = new Paint(), txt = new Paint(Paint.ANTI_ALIAS_FLAG);
                      {
                          dim.setColor(Color.parseColor("#7707050c"));
                          box.setColor(Color.parseColor(pinForAuto ? "#34d399" : "#c084fc"));
                          box.setStyle(Paint.Style.STROKE); box.setStrokeWidth(dp(3));
                          txt.setColor(Color.WHITE); txt.setTextSize(dp(15)); txt.setTextAlign(Paint.Align.CENTER);
                      }
                      @Override protected void onDraw(Canvas c) {
                          c.drawRect(0, 0, getWidth(), getHeight(), dim);
                          if (sel.width() > 5 && sel.height() > 5) c.drawRect(sel, box);
                          else c.drawText(pinForAuto ? "Sabitlenecek altyazı/metin alanını çiz" : "Çevirmek istediğin alanı parmağınla seç", getWidth() / 2f, getHeight() / 2f, txt);
                      }
                      float sx, sy;
                      @Override public boolean onTouchEvent(MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) { sx = e.getRawX(); sy = e.getRawY(); sel.set(sx, sy, sx, sy); invalidate(); return true; }
                          else if (e.getAction() == MotionEvent.ACTION_MOVE) { sel.set(Math.min(sx, e.getRawX()), Math.min(sy, e.getRawY()), Math.max(sx, e.getRawX()), Math.max(sy, e.getRawY())); invalidate(); return true; }
                          else if (e.getAction() == MotionEvent.ACTION_UP) {
                              try { wm.removeView(regionSelector); } catch (Exception ignored) {}
                              regionSelector = null;
                              if (sel.width() > 30 && sel.height() > 30) {
