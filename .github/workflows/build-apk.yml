                      + "window.__caiApply=function(b64,m){try{var bin=atob(b64);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);var map=JSON.parse(new TextDecoder().decode(bytes));for(var k in map){var idx=Number(k);if(st.els[idx]){st.tr[idx]=map[k];}}window.__caiSetMode(m||'tr');}catch(e){}};"
                      + "var docTitle=(document.title||'').replace(/\\s+/g,' ').trim();"
                      + "var h1El=document.querySelector('h1,.chapter-title,.chr-title,h2');"
