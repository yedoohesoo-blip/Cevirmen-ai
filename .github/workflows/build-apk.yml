                              + "  var bg=isTr?(b.bg||'#FFFFFF'):'#fffbeb', fg=isTr?(b.fg||'#090612'):'#92400e', halo=isTr?(b.halo||'rgba(255,255,255,0.98)'):'rgba(255,251,235,0.96)';"
