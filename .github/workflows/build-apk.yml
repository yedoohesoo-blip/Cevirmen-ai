                          if (e.getAction() == MotionEvent.ACTION_MOVE) { int dx = (int)(e.getRawX() - tx), dy = (int)(e.getRawY() - ty); if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true; bubbleLp.x = Math.max(0, Math.min(screenW - dp(44), ix + dx)); bubbleLp.y = Math.max(dp(24), Math.min(screenH - dp(80), iy + dy)); wm.updateViewLayout(bubbleBtn, bubbleLp); return true; }
