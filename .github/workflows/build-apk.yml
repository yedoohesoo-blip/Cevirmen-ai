              private void fetchImageAndRoute(final String imgUrl, final String mode) {
                  statusBar.setText("📷 Görsel indiriliyor…"); statusBar.setVisibility(View.VISIBLE);
                  new Thread(() -> {
                      try {
                          HttpURLConnection conn = (HttpURLConnection) new URL(imgUrl).openConnection();
                          conn.setRequestProperty("User-Agent", mobileUA);
                          String ck = CookieManager.getInstance().getCookie(imgUrl); if (ck != null) conn.setRequestProperty("Cookie", ck);
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          try (InputStream is = conn.getInputStream()) { byte[] buf = new byte[8192]; int n; while ((n = is.read(buf)) > 0) baos.write(buf, 0, n); }
                          byte[] bytes = baos.toByteArray();
                          if ("save".equals(mode)) { runOnUiThread(() -> { statusBar.setVisibility(View.GONE); saveBytesToDownloads("gorsel-" + System.currentTimeMillis() + ".jpg", bytes, "image/jpeg"); }); return; }
                          final String b64 = Base64.encodeToString(bytes, Base64.NO_WRAP);
                          runOnUiThread(() -> {
                              if ("ocr".equals(mode)) {
                                  browserRoot.setVisibility(View.GONE);
                                  appWebView.evaluateJavascript("window.__onNativeImageOcr && window.__onNativeImageOcr('" + b64 + "');", null);
                              } else {
                                  statusBar.setText("💬 Görsel çevriliyor…");
                                  appWebView.evaluateJavascript("window.__onNativeMangaCapture && window.__onNativeMangaCapture('" + b64 + "','');", null);
                              }
                          });
                      } catch (Throwable e) { runOnUiThread(() -> statusBar.setText("❌ Görsel hatası: " + e.getMessage())); }
                  }).start();
              }

              private void showTabsDialog() {
                  if (browserWebView != null && browserWebView.getUrl() != null) tabScrollY.put(browserWebView.getUrl(), browserWebView.getScrollY());
                  List<String> labels = new ArrayList<>();
                  for (int i = 0; i < tabUrls.size(); i++) { String t = tabTitles.get(i); if (t.length() > 38) t = t.substring(0, 38) + "…"; labels.add((i == activeTabIdx ? "● " : "○ ") + t); }
                  labels.add("＋ Yeni Sekme Aç"); if (tabUrls.size() > 1) labels.add("✕ Aktif Sekmeyi Kapat");
                  new AlertDialog.Builder(this).setTitle("Açık Sekmeler (" + tabUrls.size() + ")").setItems(labels.toArray(new String[0]), (d, w) -> {
                      if (w < tabUrls.size()) { activeTabIdx = w; loadInBrowser(tabUrls.get(w)); }
                      else if (w == tabUrls.size()) { tabUrls.add("https://www.google.com"); tabTitles.add("Yeni Sekme"); activeTabIdx = tabUrls.size() - 1; updateTabBtn(); loadInBrowser("https://www.google.com"); }
                      else if (tabUrls.size() > 1) { tabUrls.remove(activeTabIdx); tabTitles.remove(activeTabIdx); activeTabIdx = Math.max(0, activeTabIdx - 1); updateTabBtn(); loadInBrowser(tabUrls.get(activeTabIdx)); }
                  }).show();
              }

