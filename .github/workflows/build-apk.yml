              // YÜKSEK KONTRASTLI BALONCUK RENK SİSTEMİ (ASLA ARKAYLA KARIŞMAZ, CAM GİBİ OKUNUR!)
              private String enrichBubblesWithColors(String jsonBubbles) {
                  try {
                      JSONArray arr = new JSONArray(jsonBubbles);
                      if (lastCapturedBmp != null) {
                          int bw = lastCapturedBmp.getWidth(), bh = lastCapturedBmp.getHeight();
                          for (int i = 0; i < arr.length(); i++) {
                              JSONObject b = arr.optJSONObject(i); if (b == null) continue;
                              double x = b.optDouble("x", 10), y = b.optDouble("y", 10), w = b.optDouble("w", 20), h = b.optDouble("h", 10);
                              double[][] pts = {{x+w*0.5, y+h*0.5}, {x+w*0.2, y+h*0.2}, {x+w*0.8, y+h*0.2}, {x+w*0.2, y+h*0.8}, {x+w*0.8, y+h*0.8}};
                              double lumSum = 0;
                              for (double[] p : pts) {
                                  int px = Math.max(0, Math.min(bw - 1, Math.round((float) (p[0] / 100.0 * bw))));
                                  int py = Math.max(0, Math.min(bh - 1, Math.round((float) (p[1] / 100.0 * bh))));
                                  int c = lastCapturedBmp.getPixel(px, py);
                                  lumSum += 0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c);
                              }
                              boolean isLight = (lumSum / pts.length) > 140;
                              if (isLight) {
                                  b.put("bg", String.format("rgba(255,255,255,%.2f)", Math.max(0.94f, mangaBgAlpha)));
                                  b.put("fg", "#090612");
                                  b.put("bd", "#1f1433");
                              } else {
                                  b.put("bg", String.format("rgba(14,9,24,%.2f)", Math.max(0.95f, mangaBgAlpha)));
                                  b.put("fg", "#ffffff");
                                  b.put("bd", "#c084fc");
                              }
                          }
                      }
                      return arr.toString();
                  } catch (Exception e) { return jsonBubbles; }
              }

