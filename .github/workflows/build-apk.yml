name: APK Oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dosyaları Al
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Android Projesini Hazırla
        run: |
          mkdir -p android_app/app/src/main/java/com/cevirmen/ai
          mkdir -p android_app/app/src/main/assets
          mkdir -p android_app/app/src/main/res/drawable
          cp index.html android_app/app/src/main/assets/index.html

          cat << 'EOF' > android_app/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CevirmenAI"
          include ':app'
          EOF

          cat << 'EOF' > android_app/build.gradle
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat << 'EOF' > android_app/gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat << 'EOF' > android_app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.cevirmen.ai'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cevirmen.ai"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "4.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android_app/app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#110b1c" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#8b5cf6" android:pathData="M24,24h60a14,14 0 0,1 14,14v32a14,14 0 0,1 -14,14h-60a14,14 0 0,1 -14,-14v-32a14,14 0 0,1 14,-14z"/>
              <path android:fillColor="#ffffff" android:pathData="M62,42c-4,-4 -12,-4 -16,0c-5,5 -5,15 0,20c4,4 12,4 16,0l5,5c-7,7 -19,7 -26,0c-8,-8 -8,-22 0,-30c7,-7 19,-7 26,0z"/>
              <path android:fillColor="#d946ef" android:pathData="M51,70h6v6h-6z"/>
          </vector>
          EOF

          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="Çevirmen AI"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/cevirmen/ai/OverlayService.java
          package com.cevirmen.ai;

          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.ByteBuffer;
          import java.nio.charset.StandardCharsets;

          public class OverlayService extends Service {
              public static boolean isRunning = false;
              private WindowManager wm;
              private MediaProjection mediaProjection;
              private VirtualDisplay virtualDisplay;
              private ImageReader imageReader;
              private int screenW, screenH, screenDpi;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private TextView bubbleBtn;
              private WindowManager.LayoutParams bubbleLp;
              private LinearLayout menuBox;
              private FrameLayout resultOverlay;
              private View regionSelector;
              private boolean liveMode = false;
              private boolean busy = false;

              private final Runnable liveRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (!liveMode) return;
                      if (!busy) captureAndTranslate(null);
                      handler.postDelayed(this, 4500);
                  }
              };

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private int overlayType() {
                  return Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          : WindowManager.LayoutParams.TYPE_PHONE;
              }

              private GradientDrawable roundBg(int fill, int stroke, int rDp) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(fill);
                  d.setCornerRadius(dp(rDp));
                  if (stroke != 0) d.setStroke(dp(1), stroke);
                  return d;
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null || "STOP".equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  startForegroundNotif();

                  int code = intent.getIntExtra("code", Activity.RESULT_CANCELED);
                  Intent data = intent.getParcelableExtra("data");
                  if (data != null && mediaProjection == null) {
                      wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      DisplayMetrics dm = getResources().getDisplayMetrics();
                      screenW = dm.widthPixels;
                      screenH = dm.heightPixels;
                      screenDpi = dm.densityDpi;

                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      mediaProjection = mpm.getMediaProjection(code, data);
                      if (mediaProjection != null) {
                          mediaProjection.registerCallback(new MediaProjection.Callback() {
                              @Override public void onStop() { stopSelf(); }
                          }, handler);
                          imageReader = ImageReader.newInstance(screenW, screenH, PixelFormat.RGBA_8888, 2);
                          virtualDisplay = mediaProjection.createVirtualDisplay(
                                  "CevirmenOverlay", screenW, screenH, screenDpi,
                                  DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                                  imageReader.getSurface(), null, handler);
                          showFloatingBubble();
                          isRunning = true;
                          Toast.makeText(this, "Yüzen Çeviri aktif! Mor 'Ç' topuna dokun.", Toast.LENGTH_SHORT).show();
                      }
                  }
                  return START_NOT_STICKY;
              }

              private void startForegroundNotif() {
                  String chId = "cai_overlay_ch";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(chId, "Yüzen Çeviri", NotificationManager.IMPORTANCE_LOW);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                  }
                  Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          ? new Notification.Builder(this, chId)
                          : new Notification.Builder(this);
                  Notification n = nb.setContentTitle("Çevirmen AI — Yüzen Çeviri")
                          .setContentText("Diğer uygulamalar üzerinde çeviriye hazır")
                          .setSmallIcon(R.drawable.ic_launcher)
                          .build();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(101, n);
                  }
              }

              private void showFloatingBubble() {
                  if (bubbleBtn != null) return;
                  bubbleBtn = new TextView(this);
                  bubbleBtn.setText("Ç");
                  bubbleBtn.setTextColor(Color.WHITE);
                  bubbleBtn.setTextSize(19f);
                  bubbleBtn.setGravity(Gravity.CENTER);
                  bubbleBtn.setBackground(roundBg(Color.parseColor("#8b5cf6"), Color.parseColor("#d946ef"), 26));
                  bubbleBtn.setElevation(dp(8));

                  bubbleLp = new WindowManager.LayoutParams(
                          dp(48), dp(48), overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT);
                  bubbleLp.gravity = Gravity.TOP | Gravity.START;
                  bubbleLp.x = screenW - dp(60);
                  bubbleLp.y = screenH / 3;

                  bubbleBtn.setOnTouchListener(new View.OnTouchListener() {
                      int ix, iy; float tx, ty; boolean moved;
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  ix = bubbleLp.x; iy = bubbleLp.y;
                                  tx = e.getRawX(); ty = e.getRawY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  int dx = (int) (e.getRawX() - tx);
                                  int dy = (int) (e.getRawY() - ty);
                                  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
                                  bubbleLp.x = ix + dx;
                                  bubbleLp.y = iy + dy;
                                  wm.updateViewLayout(bubbleBtn, bubbleLp);
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) toggleMenu();
                                  return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(bubbleBtn, bubbleLp);
              }

              private void toggleMenu() {
                  if (menuBox != null) { removeMenu(); return; }
                  menuBox = new LinearLayout(this);
                  menuBox.setOrientation(LinearLayout.VERTICAL);
                  menuBox.setBackground(roundBg(Color.parseColor("#EE110b1c"), Color.parseColor("#8b5cf6"), 16));
                  menuBox.setPadding(dp(10), dp(10), dp(10), dp(10));

                  addMenuBtn("🖼️ Tam Ekran Çevir", "#8b5cf6", v -> { removeMenu(); captureAndTranslate(null); });
                  addMenuBtn("✂️ Bölge Seç & Çevir", "#a855f7", v -> { removeMenu(); openRegionSelector(); });
                  addMenuBtn(liveMode ? "⏹ Canlı Çeviriyi Durdur" : "⚡ Canlı Çeviri (Oto)", liveMode ? "#f43f5e" : "#1a1229", v -> {
                      removeMenu();
                      liveMode = !liveMode;
                      if (liveMode) {
                          Toast.makeText(this, "Canlı çeviri başladı", Toast.LENGTH_SHORT).show();
                          handler.post(liveRunnable);
                      } else {
                          handler.removeCallbacks(liveRunnable);
                          clearResults();
                      }
                  });
                  addMenuBtn("🧹 Çevirileri Temizle", "#1a1229", v -> { removeMenu(); clearResults(); });
                  addMenuBtn("✕ Yüzen Çeviriyi Kapat", "#3b1224", v -> { removeMenu(); stopSelf(); });

                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          dp(205), WindowManager.LayoutParams.WRAP_CONTENT, overlayType(),
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.CENTER;
                  wm.addView(menuBox, lp);
              }

              private void addMenuBtn(String txt, String bgHex, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(txt);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(13f);
                  b.setBackground(roundBg(Color.parseColor(bgHex), Color.parseColor("#2a1f3d"), 10));
                  b.setPadding(dp(10), dp(6), dp(10), dp(6));
                  b.setMinHeight(0); b.setMinimumHeight(dp(38));
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, dp(3), 0, dp(3));
                  menuBox.addView(b, lp);
              }

              private void removeMenu() {
                  if (menuBox != null) { try { wm.removeView(menuBox); } catch (Exception ignored) {} menuBox = null; }
              }

              private void clearResults() {
                  if (resultOverlay != null) { try { wm.removeView(resultOverlay); } catch (Exception ignored) {} resultOverlay = null; }
              }

              private void openRegionSelector() {
                  if (regionSelector != null) return;
                  final RectF sel = new RectF();
                  regionSelector = new View(this) {
                      final Paint dim = new Paint();
                      final Paint box = new Paint();
                      final Paint txt = new Paint(Paint.ANTI_ALIAS_FLAG);
                      {
                          dim.setColor(Color.parseColor("#7707050c"));
                          box.setColor(Color.parseColor("#c084fc"));
                          box.setStyle(Paint.Style.STROKE);
                          box.setStrokeWidth(dp(3));
                          txt.setColor(Color.WHITE);
                          txt.setTextSize(dp(16));
                          txt.setTextAlign(Paint.Align.CENTER);
                      }
                      @Override protected void onDraw(Canvas c) {
                          c.drawRect(0, 0, getWidth(), getHeight(), dim);
                          if (sel.width() > 5 && sel.height() > 5) c.drawRect(sel, box);
                          else c.drawText("Çevirmek istediğin alanı parmağınla seç", getWidth() / 2f, getHeight() / 2f, txt);
                      }
                      float sx, sy;
                      @Override public boolean onTouchEvent(MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              sx = e.getRawX(); sy = e.getRawY();
                              sel.set(sx, sy, sx, sy); invalidate(); return true;
                          } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              sel.set(Math.min(sx, e.getRawX()), Math.min(sy, e.getRawY()),
                                      Math.max(sx, e.getRawX()), Math.max(sy, e.getRawY()));
                              invalidate(); return true;
                          } else if (e.getAction() == MotionEvent.ACTION_UP) {
                              try { wm.removeView(regionSelector); } catch (Exception ignored) {}
                              regionSelector = null;
                              if (sel.width() > 30 && sel.height() > 30) {
                                  Rect r = new Rect((int) sel.left, (int) sel.top, (int) sel.right, (int) sel.bottom);
                                  handler.postDelayed(() -> captureAndTranslate(r), 120);
                              }
                              return true;
                          }
                          return false;
                      }
                  };
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                          overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  wm.addView(regionSelector, lp);
              }

              private void captureAndTranslate(final Rect crop) {
                  if (busy || imageReader == null) return;
                  busy = true;
                  clearResults();
                  if (bubbleBtn != null) bubbleBtn.setText("⏳");

                  handler.postDelayed(() -> {
                      Bitmap full = grabBitmap();
                      if (full == null) {
                          busy = false;
                          if (bubbleBtn != null) bubbleBtn.setText("Ç");
                          Toast.makeText(this, "Ekran görüntüsü alınamadı, tekrar dene.", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      Bitmap target = full;
                      if (crop != null) {
                          int x = Math.max(0, Math.min(crop.left, full.getWidth() - 2));
                          int y = Math.max(0, Math.min(crop.top, full.getHeight() - 2));
                          int w = Math.max(2, Math.min(crop.width(), full.getWidth() - x));
                          int h = Math.max(2, Math.min(crop.height(), full.getHeight() - y));
                          target = Bitmap.createBitmap(full, x, y, w, h);
                      }
                      int maxW = 1024;
                      if (target.getWidth() > maxW) {
                          int nh = Math.round((float) target.getHeight() * maxW / target.getWidth());
                          target = Bitmap.createScaledBitmap(target, maxW, nh, true);
                      }
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      target.compress(Bitmap.CompressFormat.JPEG, 82, baos);
                      final String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);

                      new Thread(() -> callVisionAndShow(b64, crop)).start();
                  }, 140);
              }

              private Bitmap grabBitmap() {
                  Image img = null;
                  try {
                      img = imageReader.acquireLatestImage();
                      if (img == null) return null;
                      Image.Plane[] planes = img.getPlanes();
                      ByteBuffer buf = planes[0].getBuffer();
                      int pixelStride = planes[0].getPixelStride();
                      int rowStride = planes[0].getRowStride();
                      int rowPadding = rowStride - pixelStride * screenW;
                      Bitmap bmp = Bitmap.createBitmap(screenW + rowPadding / pixelStride, screenH, Bitmap.Config.ARGB_8888);
                      bmp.copyPixelsFromBuffer(buf);
                      return Bitmap.createBitmap(bmp, 0, 0, screenW, screenH);
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (img != null) img.close();
                  }
              }

              private void callVisionAndShow(String b64Jpeg, Rect crop) {
                  try {
                      SharedPreferences sp = getSharedPreferences("cai_cfg", MODE_PRIVATE);
                      String apiKey = sp.getString("apiKey", "");
                      String baseUrl = sp.getString("baseUrl", "https://api.literouter.com/v1");
                      String model = sp.getString("model", "");
                      String tgtLang = sp.getString("tgtLang", "Türkçe");
                      if (apiKey.isEmpty() || model.isEmpty()) throw new Error("API Key veya Model eksik!");

                      String sys = "Görseldeki tüm yazıları/konuşma baloncuklarını tespit et ve " + tgtLang + " diline doğal çevir. "
                              + "SADECE JSON dizisi döndür: [{\"x\":10,\"y\":20,\"w\":30,\"h\":10,\"tr\":\"çeviri\"}]. "
                              + "x,y,w,h yüzde (0-100) değerleridir. Yazı yoksa [] döndür.";

                      JSONObject req = new JSONObject();
                      req.put("model", model);
                      req.put("temperature", 0.2);
                      req.put("stream", false);
                      JSONArray msgs = new JSONArray();
                      msgs.put(new JSONObject().put("role", "system").put("content", sys));
                      JSONArray uc = new JSONArray();
                      uc.put(new JSONObject().put("type", "text").put("text", "Görseldeki metinleri konumlarıyla çevir."));
                      uc.put(new JSONObject().put("type", "image_url").put("image_url",
                              new JSONObject().put("url", "data:image/jpeg;base64," + b64Jpeg)));
                      msgs.put(new JSONObject().put("role", "user").put("content", uc));
                      req.put("messages", msgs);

                      HttpURLConnection conn = (HttpURLConnection) new URL(baseUrl.replaceAll("/+$", "") + "/chat/completions").openConnection();
                      conn.setRequestMethod("POST");
                      conn.setRequestProperty("Content-Type", "application/json");
                      conn.setRequestProperty("Authorization", "Bearer " + apiKey);
                      conn.setConnectTimeout(20000);
                      conn.setReadTimeout(45000);
                      conn.setDoOutput(true);
                      try (OutputStream os = conn.getOutputStream()) {
                          os.write(req.toString().getBytes(StandardCharsets.UTF_8));
                      }
                      int code = conn.getResponseCode();
                      BufferedReader br = new BufferedReader(new InputStreamReader(
                              code >= 200 && code < 300 ? conn.getInputStream() : conn.getErrorStream(), StandardCharsets.UTF_8));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = br.readLine()) != null) sb.append(line);
                      if (code < 200 || code >= 300) throw new Exception("API " + code);

                      String content = new JSONObject(sb.toString()).getJSONArray("choices")
                              .getJSONObject(0).getJSONObject("message").getString("content");
                      int sIdx = content.indexOf('['), eIdx = content.lastIndexOf(']');
                      JSONArray arr = (sIdx >= 0 && eIdx > sIdx) ? new JSONArray(content.substring(sIdx, eIdx + 1)) : new JSONArray();

                      handler.post(() -> {
                          busy = false;
                          if (bubbleBtn != null) bubbleBtn.setText("Ç");
                          showBubblesOverlay(arr, crop);
                      });
                  } catch (Throwable e) {
                      handler.post(() -> {
                          busy = false;
                          if (bubbleBtn != null) bubbleBtn.setText("Ç");
                          Toast.makeText(this, "Çeviri hatası: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      });
                  }
              }

              private void showBubblesOverlay(JSONArray arr, Rect crop) {
                  clearResults();
                  if (arr.length() == 0) {
                      Toast.makeText(this, "Çevrilecek yazı bulunamadı", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  resultOverlay = new FrameLayout(this);
                  int ox = crop != null ? crop.left : 0;
                  int oy = crop != null ? crop.top : 0;
                  int ow = crop != null ? crop.width() : screenW;
                  int oh = crop != null ? crop.height() : screenH;

                  for (int i = 0; i < arr.length(); i++) {
                      JSONObject b = arr.optJSONObject(i);
                      if (b == null) continue;
                      String tr = b.optString("tr", "").trim();
                      if (tr.isEmpty()) continue;

                      int bx = ox + Math.round((float) b.optDouble("x", 10) / 100f * ow);
                      int by = oy + Math.round((float) b.optDouble("y", 10) / 100f * oh);
                      int bw = Math.max(dp(90), Math.round((float) b.optDouble("w", 30) / 100f * ow));

                      TextView tv = new TextView(this);
                      tv.setText(tr);
                      tv.setTextColor(Color.WHITE);
                      tv.setTextSize(13f);
                      tv.setBackground(roundBg(Color.parseColor("#E6110b1c"), Color.parseColor("#a855f7"), 10));
                      tv.setPadding(dp(8), dp(5), dp(8), dp(5));
                      tv.setOnClickListener(v -> clearResults());

                      FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(bw, FrameLayout.LayoutParams.WRAP_CONTENT);
                      lp.leftMargin = Math.max(0, Math.min(bx, screenW - bw));
                      lp.topMargin = Math.max(0, Math.min(by, screenH - dp(60)));
                      resultOverlay.addView(tv, lp);
                  }
                  resultOverlay.setOnClickListener(v -> clearResults());

                  WindowManager.LayoutParams wlp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                          overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  wm.addView(resultOverlay, wlp);
                  // Mor top her zaman üstte kalsın
                  if (bubbleBtn != null) {
                      try { wm.removeView(bubbleBtn); wm.addView(bubbleBtn, bubbleLp); } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onDestroy() {
                  isRunning = false;
                  liveMode = false;
                  handler.removeCallbacks(liveRunnable);
                  removeMenu();
                  clearResults();
