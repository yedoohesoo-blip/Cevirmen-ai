              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && filePathCallback != null) {
                      Uri[] results = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) { int n = data.getClipData().getItemCount(); results = new Uri[n]; for (int i = 0; i < n; i++) results[i] = data.getClipData().getItemAt(i).getUri(); }
                          else if (data.getData() != null) results = new Uri[]{ data.getData() };
                      }
                      filePathCallback.onReceiveValue(results); filePathCallback = null;
                  } else if (req == OVERLAY_REQ) {
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)) startActivityForResult(((MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE)).createScreenCaptureIntent(), PROJ_REQ);
                  } else if (req == PROJ_REQ && res == RESULT_OK && data != null) {
                      Intent svc = new Intent(this, OverlayService.class); svc.putExtra("code", res); svc.putExtra("data", data);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc); else startService(svc);
                  } else if (req == VPN_REQ && res == RESULT_OK) {
                      Intent svc = new Intent(this, AdBlockVpnService.class);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc); else startService(svc);
                      updateAdBtnVisual();
                  } else if (req == VOICE_REQ && res == RESULT_OK && data != null) {
                      ArrayList<String> list = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (list != null && !list.isEmpty()) {
                          String b64 = Base64.encodeToString(list.get(0).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          appWebView.evaluateJavascript("window.__onVoiceResult && window.__onVoiceResult('" + b64 + "');", null);
                      }
                  }
              }

              @Override public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (readerOpenNative && browserRoot.getVisibility() != View.VISIBLE) {
                      if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) { appWebView.evaluateJavascript("window.__onVolumeKey && window.__onVolumeKey('down');", null); return true; }
                      if (keyCode == KeyEvent.KEYCODE_VOLUME_UP) { appWebView.evaluateJavascript("window.__onVolumeKey && window.__onVolumeKey('up');", null); return true; }
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override public void onBackPressed() {
                  if (regionView != null) { browserRoot.removeView(regionView); regionView = null; return; }
                  if (findBar != null && findBar.getVisibility() == View.VISIBLE) { browserWebView.clearMatches(); findBar.setVisibility(View.GONE); return; }
                  if (browserRoot.getVisibility() == View.VISIBLE) { if (browserWebView.canGoBack()) browserWebView.goBack(); else browserRoot.setVisibility(View.GONE); return; }
                  appWebView.evaluateJavascript("(function(){return window.__onHardwareBack ? window.__onHardwareBack() : 'exit';})();", val -> {
                      if (val != null && val.contains("handled")) return;
                      if (appWebView.canGoBack()) appWebView.goBack();
                      else MainActivity.super.onBackPressed();
                  });
              }

              @Override protected void onDestroy() {
                  if (activeInstance == this) activeInstance = null;
                  if (lastCapturedBmp != null && !lastCapturedBmp.isRecycled()) { lastCapturedBmp.recycle(); lastCapturedBmp = null; }
                  super.onDestroy();
              }
          }
