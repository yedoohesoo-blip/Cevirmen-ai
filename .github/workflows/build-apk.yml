                      + (twAntiPopup ? "var ap=document.getElementById('cai-antipop');if(!ap){ap=document.createElement('style');ap.id='cai-antipop';ap.textContent='[class*=\"paywall\"],[class*=\"modal-backdrop\"],[class*=\"cookie-banner\"],[class*=\"age-gate\"]{display:none!important}*{filter:none!important}';document.head.appendChild(ap);}" : "")
                      + "if(window.__caiHelpersInit)return;window.__caiHelpersInit=1;"
