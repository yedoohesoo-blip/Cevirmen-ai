              private Bitmap safeCopyLatestFrame() { synchronized (frameLock) { if (latestFrame == null || latestFrame.isRecycled()) return null; return latestFrame.copy(Bitmap.Config.ARGB_8888, false); } }
              private boolean hasSignificantChange(Bitmap bmp) {
                  Bitmap tiny = Bitmap.createScaledBitmap(bmp, 32, 32, false); int[] px = new int[1024]; tiny.getPixels(px, 0, 32, 0, 0, 32, 32); tiny.recycle();
                  if (lastFrameSample == null) { lastFrameSample = px; return true; }
                  long diffSum = 0; for (int i = 0; i < 1024; i++) { int c1 = lastFrameSample[i], c2 = px[i]; diffSum += Math.abs(Color.red(c1) - Color.red(c2)) + Math.abs(Color.green(c1) - Color.green(c2)) + Math.abs(Color.blue(c1) - Color.blue(c2)); }
                  if ((diffSum / (1024.0 * 3.0 * 255.0)) * 100.0 >= 2.8) { lastFrameSample = px; return true; }
                  return false;
              }

              private void captureAndAction(final Rect crop, final String action, final String promptText, final boolean skipIfUnchanged) {
                  if (busy) return; busy = true;
                  if (("translate".equals(action) || "subtitle".equals(action)) && !skipIfUnchanged) clearResults();
                  if (bubbleBtn != null) { bubbleBtn.setText("⏳"); bubbleBtn.setVisibility(View.INVISIBLE); }
                  frameWanted = true;
                  handler.postDelayed(() -> {
                      Bitmap full = safeCopyLatestFrame();
                      if (bubbleBtn != null) bubbleBtn.setVisibility(View.VISIBLE);
                      if (full == null) { busy = false; if (bubbleBtn != null) bubbleBtn.setText("Ç"); if (!skipIfUnchanged) Toast.makeText(this, "Ekran karesi bekleniyor, tekrar bas.", Toast.LENGTH_SHORT).show(); return; }
                      Bitmap target = full, scaled = null; final String b64;
                      try {
                          if (crop != null) { int x = Math.max(0, Math.min(crop.left, full.getWidth() - 2)), y = Math.max(0, Math.min(crop.top, full.getHeight() - 2)), w = Math.max(2, Math.min(crop.width(), full.getWidth() - x)), h = Math.max(2, Math.min(crop.height(), full.getHeight() - y)); target = Bitmap.createBitmap(full, x, y, w, h); }
                          if (skipIfUnchanged && !hasSignificantChange(target)) { busy = false; if (bubbleBtn != null) bubbleBtn.setText("Ç"); return; }
                          scaled = target.getWidth() > 1024 ? Bitmap.createScaledBitmap(target, 1024, Math.round((float) target.getHeight() * 1024 / target.getWidth()), true) : target;
                          ByteArrayOutputStream baos = new ByteArrayOutputStream(); scaled.compress(Bitmap.CompressFormat.JPEG, 82, baos);
                          b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                      } finally {
                          if (scaled != null && scaled != target && scaled != full && !scaled.isRecycled()) scaled.recycle();
                          if (target != full && !target.isRecycled()) target.recycle();
                          if (!full.isRecycled()) full.recycle();
                      }
                      new Thread(() -> {
                          try {
                              if ("copy".equals(action)) {
                                  String out = callAiSimple("Görseldeki tüm metinleri çıkar. Sadece metni yaz.", "Metni çıkar.", b64);
                                  handler.post(() -> { busy = false; if (bubbleBtn != null) bubbleBtn.setText("Ç"); ((ClipboardManager) getSystemService(CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText("OCR", out)); showResultCard("📋 Kopyalanan Metin", out); scheduleBubbleDim(); });
                              } else if ("ask".equals(action)) {
                                  String out = callAiSimple("Ekran görüntüsüyle ilgili soruyu Türkçe yanıtla.", promptText, b64);
                                  handler.post(() -> { busy = false; if (bubbleBtn != null) bubbleBtn.setText("Ç"); showResultCard("❓ AI Yanıtı", out); scheduleBubbleDim(); });
                              } else if ("subtitle".equals(action)) {
                                  String out = callAiSimple("Görseldeki diyalog/alt yazıyı hedef dile kısa, doğal tek veya iki satır alt yazı olarak çevir. Sadece çeviriyi yaz. Yazı yoksa boş dön.", "Alt yazıyı çevir.", b64);
                                  handler.post(() -> { busy = false; if (bubbleBtn != null) bubbleBtn.setText("Ç"); if (out != null && out.trim().length() > 1) showSubtitleBar(out.trim()); scheduleBubbleDim(); });
                              } else {
