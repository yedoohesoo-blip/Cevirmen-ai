              private void openBrowserRegionSelector(final boolean saveAsPanel) {
                  if (regionView != null) return;
                  final RectF sel = new RectF();
                  regionView = new View(this) {
                      final Paint dim = new Paint(), box = new Paint(), txt = new Paint(Paint.ANTI_ALIAS_FLAG);
                      { dim.setColor(Color.parseColor("#6607050c")); box.setColor(Color.parseColor(saveAsPanel ? "#34d399" : "#d946ef")); box.setStyle(Paint.Style.STROKE); box.setStrokeWidth(dp(3)); txt.setColor(Color.WHITE); txt.setTextSize(dp(15)); txt.setTextAlign(Paint.Align.CENTER); }
                      @Override protected void onDraw(Canvas c) { c.drawRect(0, 0, getWidth(), getHeight(), dim); if (sel.width() > 5 && sel.height() > 5) c.drawRect(sel, box); else c.drawText(saveAsPanel ? "Kırpılacak paneli seç" : "Çevrilecek alanı seç", getWidth() / 2f, getHeight() / 2f, txt); }
                      float sx, sy;
                      @Override public boolean onTouchEvent(MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) { sx = e.getX(); sy = e.getY(); sel.set(sx, sy, sx, sy); invalidate(); return true; }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) { sel.set(Math.min(sx, e.getX()), Math.min(sy, e.getY()), Math.max(sx, e.getX()), Math.max(sy, e.getY())); invalidate(); return true; }
                          if (e.getAction() == MotionEvent.ACTION_UP) {
                              browserRoot.removeView(regionView); regionView = null;
                              if (sel.width() > 30 && sel.height() > 30) { int[] bLoc = new int[2], rLoc = new int[2]; browserWebView.getLocationInWindow(bLoc); browserRoot.getLocationInWindow(rLoc); int dy = bLoc[1] - rLoc[1]; captureViewportForManga(new Rect((int) sel.left, Math.max(0, (int) sel.top - dy), (int) sel.right, Math.max(10, (int) sel.bottom - dy)), saveAsPanel); }
                              return true;
                          }
                          return false;
                      }
                  };
                  browserRoot.addView(regionView, new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
              }

              private void downloadDirectlyToLibrary(final String fileUrl, final String filename, final String ua) {
                  new Thread(() -> {
                      try {
                          HttpURLConnection conn = (HttpURLConnection) new URL(fileUrl).openConnection();
                          String cookies = CookieManager.getInstance().getCookie(fileUrl); if (cookies != null) conn.setRequestProperty("Cookie", cookies);
                          if (ua != null) conn.setRequestProperty("User-Agent", ua);
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          try (InputStream is = conn.getInputStream()) { byte[] buf = new byte[8192]; int n; while ((n = is.read(buf)) > 0) baos.write(buf, 0, n); }
                          final String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                          final String fn64 = Base64.encodeToString(filename.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          runOnUiThread(() -> appWebView.evaluateJavascript("window.__onNativeFileImport && window.__onNativeFileImport('" + fn64 + "','" + b64 + "',false);", null));
                      } catch (Exception e) { runOnUiThread(() -> Toast.makeText(this, "İndirme hatası: " + e.getMessage(), Toast.LENGTH_LONG).show()); }
                  }).start();
              }

              private void loadInBrowser(String input) {
                  String q = input == null ? "" : input.trim(); if (q.isEmpty()) q = "https://www.google.com";
                  String url = (q.startsWith("http://") || q.startsWith("https://")) ? q : (!q.contains(" ") && q.contains(".")) ? "https://" + q : "https://www.google.com/search?q=" + Uri.encode(q);
                  urlBar.setText(url); browserWebView.loadUrl(url);
              }

              private void captureViewportForManga(final Rect crop, final boolean savePanelOnly) {
                  final int w = browserWebView.getWidth(), h = browserWebView.getHeight(); if (w <= 0 || h <= 0) return;
                  pendingCropRect = crop;
                  if (!savePanelOnly) { statusBar.setText(crop != null ? "✂️ Seçili alan taranıyor…" : "💬 Manga ekranı taranıyor…"); statusBar.setVisibility(View.VISIBLE); }
                  browserWebView.evaluateJavascript("document.querySelectorAll('.cai-mb').forEach(function(e){e.style.visibility='hidden';});", v -> new Handler(Looper.getMainLooper()).postDelayed(() -> doPixelCapture(w, h, crop, savePanelOnly), 80));
              }

              private void doPixelCapture(int w, int h, Rect crop, boolean savePanelOnly) {
                  final Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      int[] loc = new int[2]; browserWebView.getLocationInWindow(loc);
                      try { PixelCopy.request(getWindow(), new Rect(loc[0], loc[1], loc[0] + w, loc[1] + h), bmp, res -> { restoreHiddenBubbles(); if (res == PixelCopy.SUCCESS) processCapturedBitmap(bmp, crop, savePanelOnly); else { bmp.recycle(); fallbackCanvasCapture(w, h, crop, savePanelOnly); } }, new Handler(Looper.getMainLooper())); }
                      catch (Exception e) { bmp.recycle(); restoreHiddenBubbles(); fallbackCanvasCapture(w, h, crop, savePanelOnly); }
                  } else { bmp.recycle(); restoreHiddenBubbles(); fallbackCanvasCapture(w, h, crop, savePanelOnly); }
              }
              private void fallbackCanvasCapture(int w, int h, Rect crop, boolean savePanelOnly) {
                  try { Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888); Canvas c = new Canvas(bmp); c.translate(-browserWebView.getScrollX(), -browserWebView.getScrollY()); browserWebView.draw(c); processCapturedBitmap(bmp, crop, savePanelOnly); }
                  catch (Exception e) { statusBar.setText("❌ Ekran yakalanamadı: " + e.getMessage()); }
              }
              private void restoreHiddenBubbles() { browserWebView.evaluateJavascript("document.querySelectorAll('.cai-mb').forEach(function(e){e.style.visibility='visible';});", null); }

              private void processCapturedBitmap(Bitmap bmp, Rect crop, boolean savePanelOnly) {
                  Bitmap target = bmp, scaled = null;
                  try {
                      if (crop != null) { int x = Math.max(0, Math.min(crop.left, bmp.getWidth() - 2)), y = Math.max(0, Math.min(crop.top, bmp.getHeight() - 2)), cw = Math.max(2, Math.min(crop.width(), bmp.getWidth() - x)), ch = Math.max(2, Math.min(crop.height(), bmp.getHeight() - y)); target = Bitmap.createBitmap(bmp, x, y, cw, ch); bmp.recycle(); }
                      if (savePanelOnly) { ByteArrayOutputStream baos = new ByteArrayOutputStream(); target.compress(Bitmap.CompressFormat.PNG, 100, baos); saveBytesToDownloads("manga-panel-" + System.currentTimeMillis() + ".png", baos.toByteArray(), "image/png"); target.recycle(); return; }
                      if (lastCapturedBmp != null && !lastCapturedBmp.isRecycled()) lastCapturedBmp.recycle();
                      lastCapturedBmp = target;
                      scaled = target.getWidth() > 1080 ? Bitmap.createScaledBitmap(target, 1080, Math.round((float) target.getHeight() * 1080 / target.getWidth()), true) : target;
                      ByteArrayOutputStream baos = new ByteArrayOutputStream(); scaled.compress(Bitmap.CompressFormat.JPEG, 85, baos);
                      if (scaled != target && !scaled.isRecycled()) scaled.recycle();
                      String curUrl = browserWebView.getUrl() != null ? browserWebView.getUrl() : "";
                      String cacheKey = Base64.encodeToString((curUrl + "|" + (browserWebView.getScrollY() / 120)).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                      appWebView.evaluateJavascript("window.__onNativeMangaCapture && window.__onNativeMangaCapture('" + Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP) + "','" + cacheKey + "');", null);
                  } catch (Exception e) { statusBar.setText("❌ Görsel hatası: " + e.getMessage()); }
              }

              private void saveBytesToDownloads(String filename, byte[] bytes, String mimeType) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentValues cv = new ContentValues(); cv.put(MediaStore.Downloads.DISPLAY_NAME, filename); cv.put(MediaStore.Downloads.MIME_TYPE, mimeType); cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                          if (uri != null) try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(bytes); }
                      } else { try (FileOutputStream fos = new FileOutputStream(new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), filename))) { fos.write(bytes); } }
                      Toast.makeText(this, "Kaydedildi: " + filename, Toast.LENGTH_LONG).show();
                  } catch (Exception e) { Toast.makeText(this, "Kayıt hatası: " + e.getMessage(), Toast.LENGTH_LONG).show(); }
              }

