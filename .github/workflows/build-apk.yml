          cat << 'EOF' > android_app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:resizeableActivity="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
                  <service
                      android:name=".AdBlockVpnService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/cevirmen/ai/AdBlockVpnService.java
          package com.cevirmen.ai;

          import android.content.Intent;
          import android.net.VpnService;
          import android.os.ParcelFileDescriptor;
          import android.widget.Toast;

          public class AdBlockVpnService extends VpnService {
              public static volatile boolean isRunning = false;
              private ParcelFileDescriptor vpnInterface = null;

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && "STOP".equals(intent.getAction())) { stopVpn(); stopSelf(); return START_NOT_STICKY; }
                  startVpn();
                  return START_STICKY;
              }

              private void startVpn() {
                  if (vpnInterface != null) return;
                  try {
                      Builder b = new Builder();
                      b.setSession("Çevirmen AI — AdGuard DNS");
                      b.addAddress("10.111.222.1", 32);
                      b.addRoute("10.111.222.2", 32);
                      b.addDnsServer("94.140.14.14");
                      b.addDnsServer("94.140.15.15");
                      vpnInterface = b.establish();
                      if (vpnInterface != null) {
                          isRunning = true;
                          Toast.makeText(this, "🛡️ AdGuard DNS Kalkanı Aktif!", Toast.LENGTH_SHORT).show();
                      }
                  } catch (Throwable e) {
                      isRunning = false;
                      Toast.makeText(this, "VPN başlatılamadı: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void stopVpn() {
                  isRunning = false;
                  if (vpnInterface != null) { try { vpnInterface.close(); } catch (Exception ignored) {} vpnInterface = null; }
              }
              @Override public void onDestroy() { stopVpn(); super.onDestroy(); }
              @Override public void onRevoke() { stopVpn(); stopSelf(); super.onRevoke(); }
          }
          EOF

          cat << 'EOF' > android_app/app/src/main/java/com/cevirmen/ai/OverlayService.java
          package com.cevirmen.ai;

          import android.app.Activity;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.util.Base64;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.ByteBuffer;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class OverlayService extends Service {
              public static boolean isRunning = false;
              private WindowManager wm;
              private MediaProjection mediaProjection;
              private VirtualDisplay virtualDisplay;
              private ImageReader imageReader;
              private int screenW, screenH, screenDpi;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Object frameLock = new Object();
              private Bitmap latestFrame = null;

              private TextView bubbleBtn;
              private WindowManager.LayoutParams bubbleLp;
              private LinearLayout menuBox;
              private FrameLayout resultOverlay;
              private View regionSelector;
              private LinearLayout infoCard;
              private boolean liveMode = false;
              private Rect pinnedRect = null;
              private boolean busy = false;

              private final Runnable liveRunnable = new Runnable() {
                  @Override public void run() { if (!liveMode) return; if (!busy) captureAndAction(pinnedRect, "translate", null); handler.postDelayed(this, 4500); }
              };

              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }
              private int overlayType() { return Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE; }
              private GradientDrawable roundBg(int fill, int stroke, int rDp) { GradientDrawable d = new GradientDrawable(); d.setColor(fill); d.setCornerRadius(dp(rDp)); if (stroke != 0) d.setStroke(dp(1), stroke); return d; }

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null || "STOP".equals(intent.getAction())) { stopSelf(); return START_NOT_STICKY; }
                  startForegroundNotif();
                  int code = intent.getIntExtra("code", Activity.RESULT_CANCELED);
                  Intent data = intent.getParcelableExtra("data");
                  if (data != null && mediaProjection == null) {
                      wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                      DisplayMetrics dm = new DisplayMetrics(); wm.getDefaultDisplay().getRealMetrics(dm);
                      screenW = dm.widthPixels; screenH = dm.heightPixels; screenDpi = dm.densityDpi;
                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      mediaProjection = mpm.getMediaProjection(code, data);
                      if (mediaProjection != null) {
                          mediaProjection.registerCallback(new MediaProjection.Callback() { @Override public void onStop() { stopSelf(); } }, handler);
                          imageReader = ImageReader.newInstance(screenW, screenH, PixelFormat.RGBA_8888, 3);
                          imageReader.setOnImageAvailableListener(reader -> {
                              Image img = null;
                              try {
                                  img = reader.acquireLatestImage(); if (img == null) return;
                                  Image.Plane[] planes = img.getPlanes(); ByteBuffer buf = planes[0].getBuffer();
                                  int ps = planes[0].getPixelStride(), rs = planes[0].getRowStride(), rp = rs - ps * screenW;
                                  Bitmap raw = Bitmap.createBitmap(screenW + rp / ps, screenH, Bitmap.Config.ARGB_8888);
                                  raw.copyPixelsFromBuffer(buf);
                                  Bitmap clean = Bitmap.createBitmap(raw, 0, 0, screenW, screenH); raw.recycle();
                                  synchronized (frameLock) { if (latestFrame != null && !latestFrame.isRecycled()) latestFrame.recycle(); latestFrame = clean; }
                              } catch (Throwable ignored) {} finally { if (img != null) img.close(); }
                          }, handler);
                          virtualDisplay = mediaProjection.createVirtualDisplay("CevirmenOverlay", screenW, screenH, screenDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader.getSurface(), null, handler);
                          showFloatingBubble(); isRunning = true;
                          Toast.makeText(this, "Yüzen Çeviri aktif! Mor 'Ç' topuna dokun.", Toast.LENGTH_SHORT).show();
                      }
                  }
                  return START_NOT_STICKY;
              }

              private void startForegroundNotif() {
                  String chId = "cai_overlay_ch";
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(new NotificationChannel(chId, "Yüzen Çeviri", NotificationManager.IMPORTANCE_LOW));
                  Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(this, chId) : new Notification.Builder(this);
                  Notification n = nb.setContentTitle("Çevirmen AI — Yüzen Çeviri").setContentText("Aktif").setSmallIcon(R.drawable.ic_launcher).build();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) startForeground(101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION); else startForeground(101, n);
              }

              private void showFloatingBubble() {
                  if (bubbleBtn != null) return;
                  bubbleBtn = new TextView(this); bubbleBtn.setText("Ç"); bubbleBtn.setTextColor(Color.WHITE); bubbleBtn.setTextSize(17f); bubbleBtn.setTypeface(null, Typeface.BOLD); bubbleBtn.setGravity(Gravity.CENTER);
                  bubbleBtn.setBackground(roundBg(Color.parseColor("#8b5cf6"), Color.parseColor("#d946ef"), 24)); bubbleBtn.setElevation(dp(8));
                  bubbleLp = new WindowManager.LayoutParams(dp(44), dp(44), overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  bubbleLp.gravity = Gravity.TOP | Gravity.START; bubbleLp.x = screenW - dp(54); bubbleLp.y = screenH / 3;
                  bubbleBtn.setOnTouchListener(new View.OnTouchListener() {
                      int ix, iy; float tx, ty; boolean moved;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) { ix = bubbleLp.x; iy = bubbleLp.y; tx = e.getRawX(); ty = e.getRawY(); moved = false; return true; }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) { int dx = (int) (e.getRawX() - tx), dy = (int) (e.getRawY() - ty); if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true; bubbleLp.x = ix + dx; bubbleLp.y = iy + dy; wm.updateViewLayout(bubbleBtn, bubbleLp); return true; }
                          if (e.getAction() == MotionEvent.ACTION_UP) { if (!moved) toggleMenu(); return true; }
                          return false;
                      }
                  });
                  wm.addView(bubbleBtn, bubbleLp);
              }

              private void toggleMenu() {
                  if (menuBox != null) { removeMenu(); return; }
                  menuBox = new LinearLayout(this); menuBox.setOrientation(LinearLayout.VERTICAL); menuBox.setBackground(roundBg(Color.parseColor("#F5110b1c"), Color.parseColor("#8b5cf6"), 16)); menuBox.setPadding(dp(10), dp(10), dp(10), dp(10));
                  addMenuBtn("🖼️ Tam Ekran Çevir", "#8b5cf6", v -> { removeMenu(); captureAndAction(null, "translate", null); });
                  addMenuBtn("✂️ Bölge Seç & Çevir", "#a855f7", v -> { removeMenu(); openRegionSelector(false); });
                  addMenuBtn(pinnedRect != null && liveMode ? "⏹ Sabit Bölgeyi Durdur" : "📌 Sabit Bölge Oto-Çevir", pinnedRect != null && liveMode ? "#f43f5e" : "#6d28d9", v -> { removeMenu(); if (pinnedRect != null && liveMode) { liveMode = false; pinnedRect = null; handler.removeCallbacks(liveRunnable); clearResults(); } else openRegionSelector(true); });
                  addMenuBtn(liveMode && pinnedRect == null ? "⏹ Canlı Çeviriyi Durdur" : "⚡ Canlı Tam Ekran (Oto)", liveMode && pinnedRect == null ? "#f43f5e" : "#1a1229", v -> { removeMenu(); if (liveMode && pinnedRect == null) { liveMode = false; handler.removeCallbacks(liveRunnable); clearResults(); } else { pinnedRect = null; liveMode = true; handler.post(liveRunnable); } });
                  addMenuBtn("📋 Ekrandaki Metni Kopyala", "#1a1229", v -> { removeMenu(); captureAndAction(null, "copy", null); });
                  addMenuBtn("❓ Ekrana Soru Sor", "#1a1229", v -> { removeMenu(); openAskDialog(); });
                  addMenuBtn("📎 Panoyu Çevir", "#1a1229", v -> { removeMenu(); translateClipboardNow(); });
                  addMenuBtn("🧹 Temizle", "#1a1229", v -> { removeMenu(); clearResults(); removeInfoCard(); });
                  addMenuBtn("✕ Yüzen Çeviriyi Kapat", "#3b1224", v -> { removeMenu(); stopSelf(); });
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(dp(220), WindowManager.LayoutParams.WRAP_CONTENT, overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.CENTER; wm.addView(menuBox, lp);
              }

              private void addMenuBtn(String txt, String bgHex, View.OnClickListener l) {
                  Button b = new Button(this); b.setText(txt); b.setAllCaps(false); b.setTextColor(Color.WHITE); b.setTextSize(12f); b.setBackground(roundBg(Color.parseColor(bgHex), Color.parseColor("#2a1f3d"), 10)); b.setPadding(dp(10), dp(4), dp(10), dp(4)); b.setMinHeight(0); b.setMinimumHeight(dp(34)); b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT); lp.setMargins(0, dp(2), 0, dp(2)); menuBox.addView(b, lp);
              }
              private void removeMenu() { if (menuBox != null) { try { wm.removeView(menuBox); } catch (Exception ignored) {} menuBox = null; } }
              private void clearResults() { if (resultOverlay != null) { try { wm.removeView(resultOverlay); } catch (Exception ignored) {} resultOverlay = null; } }
              private void removeInfoCard() { if (infoCard != null) { try { wm.removeView(infoCard); } catch (Exception ignored) {} infoCard = null; } }

              private void openAskDialog() {
                  removeInfoCard(); infoCard = new LinearLayout(this); infoCard.setOrientation(LinearLayout.VERTICAL); infoCard.setBackground(roundBg(Color.parseColor("#F5110b1c"), Color.parseColor("#8b5cf6"), 16)); infoCard.setPadding(dp(14), dp(14), dp(14), dp(14));
                  TextView title = new TextView(this); title.setText("❓ Ekrandaki Görüntüye Soru Sor"); title.setTextColor(Color.parseColor("#c084fc")); title.setTextSize(14f);
                  EditText inp = new EditText(this); inp.setHint("Sorun..."); inp.setHintTextColor(Color.parseColor("#9a8fb0")); inp.setTextColor(Color.WHITE); inp.setBackground(roundBg(Color.parseColor("#1a1229"), Color.parseColor("#2a1f3d"), 10)); inp.setPadding(dp(10), dp(8), dp(10), dp(8));
                  LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
                  Button ask = new Button(this); ask.setText("Sor"); ask.setTextColor(Color.WHITE); ask.setBackground(roundBg(Color.parseColor("#8b5cf6"), 0, 10));
                  ask.setOnClickListener(v -> { String q = inp.getText().toString().trim(); removeInfoCard(); captureAndAction(null, "ask", q.isEmpty() ? "Bu ekrandaki içeriği özetle." : q); });
                  Button cancel = new Button(this); cancel.setText("İptal"); cancel.setTextColor(Color.WHITE); cancel.setBackground(roundBg(Color.parseColor("#2a1f3d"), 0, 10)); cancel.setOnClickListener(v -> removeInfoCard());
                  row.addView(ask, new LinearLayout.LayoutParams(0, dp(36), 1f)); row.addView(cancel, new LinearLayout.LayoutParams(dp(80), dp(36)));
                  infoCard.addView(title); LinearLayout.LayoutParams lpI = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT); lpI.setMargins(0, dp(8), 0, dp(10)); infoCard.addView(inp, lpI); infoCard.addView(row);
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(dp(300), WindowManager.LayoutParams.WRAP_CONTENT, overlayType(), WindowManager.LayoutParams.FLAG_DIM_BEHIND, PixelFormat.TRANSLUCENT); lp.dimAmount = 0.5f; lp.gravity = Gravity.CENTER; wm.addView(infoCard, lp);
              }

              private void showResultCard(String titleTxt, String bodyTxt) {
