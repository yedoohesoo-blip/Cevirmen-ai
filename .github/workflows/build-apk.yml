                                  final String rawFallback = raw;
                                  handler.post(() -> {
                                      busy = false; if (bubbleBtn != null) bubbleBtn.setText("Ç");
                                      if (finalArr != null && finalArr.length() > 0) showBubblesOverlay(finalArr, crop);
                                      else if (rawFallback != null && rawFallback.trim().length() > 2 && !rawFallback.trim().equals("[]")) showResultCard("🌐 Ekran Çevirisi", rawFallback.trim());
                                      else Toast.makeText(this, "Ekranda çevrilecek yazı bulunamadı", Toast.LENGTH_SHORT).show();
                                  });
                              }
                          } catch (Throwable e) {
                              handler.post(() -> { busy = false; if (bubbleBtn != null) bubbleBtn.setText("Ç"); Toast.makeText(this, "Hata: " + e.getMessage(), Toast.LENGTH_LONG).show(); });
                          }
                      }).start();
                  }, 180);
              }

              private String callAiSimple(String sys, String userText, String b64Jpeg) throws Exception {
                  SharedPreferences sp = getSharedPreferences("cai_cfg", MODE_PRIVATE);
                  String apiKey = sp.getString("apiKey", "");
                  String baseUrl = sp.getString("baseUrl", "https://api.literouter.com/v1");
                  String model = sp.getString("model", "");
                  String tgtLang = sp.getString("tgtLang", "Türkçe");
                  if (apiKey.isEmpty() || model.isEmpty()) throw new Exception("API Key veya Model eksik!");

                  JSONObject req = new JSONObject();
                  req.put("model", model); req.put("temperature", 0.2); req.put("stream", false);
                  JSONArray msgs = new JSONArray();
                  msgs.put(new JSONObject().put("role", "system").put("content", sys + " Hedef dil: " + tgtLang));
                  if (b64Jpeg != null) {
                      JSONArray uc = new JSONArray();
                      uc.put(new JSONObject().put("type", "text").put("text", userText));
                      uc.put(new JSONObject().put("type", "image_url").put("image_url", new JSONObject().put("url", "data:image/jpeg;base64," + b64Jpeg)));
                      msgs.put(new JSONObject().put("role", "user").put("content", uc));
                  } else {
                      msgs.put(new JSONObject().put("role", "user").put("content", userText));
                  }
                  req.put("messages", msgs);

                  HttpURLConnection conn = (HttpURLConnection) new URL(baseUrl.replaceAll("/+$", "") + "/chat/completions").openConnection();
                  conn.setRequestMethod("POST"); conn.setRequestProperty("Content-Type", "application/json");
                  conn.setRequestProperty("Authorization", "Bearer " + apiKey);
                  conn.setConnectTimeout(20000); conn.setReadTimeout(45000); conn.setDoOutput(true);
                  try (OutputStream os = conn.getOutputStream()) { os.write(req.toString().getBytes(StandardCharsets.UTF_8)); }
                  int code = conn.getResponseCode();
                  BufferedReader br = new BufferedReader(new InputStreamReader(code >= 200 && code < 300 ? conn.getInputStream() : conn.getErrorStream(), StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder(); String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  if (code < 200 || code >= 300) throw new Exception("API " + code);
                  return new JSONObject(sb.toString()).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content");
              }

              private void showBubblesOverlay(JSONArray arr, Rect crop) {
                  clearResults();
                  resultOverlay = new FrameLayout(this);
                  int ox = crop != null ? crop.left : 0, oy = crop != null ? crop.top : 0;
                  int ow = crop != null ? crop.width() : screenW, oh = crop != null ? crop.height() : screenH;

                  for (int i = 0; i < arr.length(); i++) {
                      JSONObject b = arr.optJSONObject(i); if (b == null) continue;
                      String tr = b.optString("tr", "").trim(); if (tr.isEmpty()) continue;
                      int bx = ox + Math.round((float) b.optDouble("x", 10) / 100f * ow);
                      int by = oy + Math.round((float) b.optDouble("y", 10) / 100f * oh);
                      int bw = Math.max(dp(110), Math.round((float) b.optDouble("w", 35) / 100f * ow));
                      TextView tv = new TextView(this);
                      tv.setText(tr); tv.setTextColor(Color.WHITE); tv.setTextSize(13.5f);
                      tv.setBackground(roundBg(Color.parseColor("#F50d0818"), Color.parseColor("#a855f7"), 10));
                      tv.setPadding(dp(9), dp(6), dp(9), dp(6));
                      tv.setOnClickListener(v -> clearResults());
                      FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(Math.min(bw, screenW - dp(16)), FrameLayout.LayoutParams.WRAP_CONTENT);
                      lp.leftMargin = Math.max(dp(4), Math.min(bx, screenW - Math.min(bw, screenW - dp(16)) - dp(4)));
                      lp.topMargin = Math.max(dp(24), Math.min(by, screenH - dp(80)));
                      resultOverlay.addView(tv, lp);
                  }
                  resultOverlay.setOnClickListener(v -> clearResults());
                  WindowManager.LayoutParams wlp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                          overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  wm.addView(resultOverlay, wlp);
                  if (bubbleBtn != null) { try { wm.removeView(bubbleBtn); wm.addView(bubbleBtn, bubbleLp); } catch (Exception ignored) {} }
              }

              @Override
              public void onDestroy() {
                  isRunning = false; liveMode = false; handler.removeCallbacks(liveRunnable);
                  removeMenu(); clearResults(); removeInfoCard();
                  if (regionSelector != null) { try { wm.removeView(regionSelector); } catch (Exception ignored) {} }
                  if (bubbleBtn != null) { try { wm.removeView(bubbleBtn); } catch (Exception ignored) {} }
                  if (virtualDisplay != null) virtualDisplay.release();
                  if (imageReader != null) imageReader.close();
                  if (mediaProjection != null) mediaProjection.stop();
                  super.onDestroy();
              }
          }
