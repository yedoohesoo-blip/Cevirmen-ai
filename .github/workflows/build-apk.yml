              <path android:fillColor="#ffffff" android:pathData="M64,41c-5,-5 -14,-5 -19,0c-6,6 -6,17 0,23c5,5 14,5 19,0l5,5c-8,8 -21,8 -29,0c-9,-9 -9,-24 0,-33c8,-8 21,-8 29,0z"/>
