                          case 7: optDesktop = !optDesktop; browserWebView.getSettings().setUserAgentString(optDesktop ? "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0.0.0 Safari/537.36" : mobileUA); browserWebView.reload(); break;
                          case 8: optAdBlock = !optAdBlock; Toast.makeText(this, optAdBlock ? "Reklam Koruma AÇIK" : "KAPALI", Toast.LENGTH_SHORT).show(); break;
