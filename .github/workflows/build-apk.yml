                  @JavascriptInterface public void showNotification(final String title, final String body, final String action) { showNativeNotification(title, body, action); }

                  @JavascriptInterface public void updateMediaNotif(final boolean active, final String title, final String sub) {
                      runOnUiThread(() -> {
                          Intent svc = new Intent(MainActivity.this, MediaPlaybackService.class);
