              private void openBrowserRegionSelector() {
                  if (regionView != null) return;
                  final RectF sel = new RectF();
                  regionView = new View(this) {
                      final Paint dim = new Paint(), box = new Paint(), txt = new Paint(Paint.ANTI_ALIAS_FLAG);
                      {
                          dim.setColor(Color.parseColor("#6607050c"));
                          box.setColor(Color.parseColor("#d946ef")); box.setStyle(Paint.Style.STROKE); box.setStrokeWidth(dp(3));
                          txt.setColor(Color.WHITE); txt.setTextSize(dp(15)); txt.setTextAlign(Paint.Align.CENTER);
                      }
                      @Override protected void onDraw(Canvas c) {
                          c.drawRect(0, 0, getWidth(), getHeight(), dim);
                          if (sel.width() > 5 && sel.height() > 5) c.drawRect(sel, box);
                          else c.drawText("Çevirmek istediğin manga alanını parmağınla seç", getWidth() / 2f, getHeight() / 2f, txt);
                      }
                      float sx, sy;
                      @Override public boolean onTouchEvent(MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              sx = e.getX(); sy = e.getY(); sel.set(sx, sy, sx, sy); invalidate(); return true;
                          } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              sel.set(Math.min(sx, e.getX()), Math.min(sy, e.getY()), Math.max(sx, e.getX()), Math.max(sy, e.getY()));
                              invalidate(); return true;
                          } else if (e.getAction() == MotionEvent.ACTION_UP) {
                              browserRoot.removeView(regionView); regionView = null;
                              if (sel.width() > 30 && sel.height() > 30) {
                                  int[] bLoc = new int[2], rLoc = new int[2];
                                  browserWebView.getLocationInWindow(bLoc); browserRoot.getLocationInWindow(rLoc);
                                  int dy = bLoc[1] - rLoc[1];
                                  Rect crop = new Rect((int) sel.left, Math.max(0, (int) sel.top - dy),
                                          (int) sel.right, Math.max(10, (int) sel.bottom - dy));
                                  captureViewportForManga(crop);
                              }
                              return true;
                          }
                          return false;
                      }
                  };
                  browserRoot.addView(regionView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
              }

              private void downloadDirectlyToLibrary(final String fileUrl, final String filename, final String ua) {
                  new Thread(() -> {
                      try {
                          HttpURLConnection conn = (HttpURLConnection) new URL(fileUrl).openConnection();
                          String cookies = CookieManager.getInstance().getCookie(fileUrl);
                          if (cookies != null) conn.setRequestProperty("Cookie", cookies);
                          if (ua != null) conn.setRequestProperty("User-Agent", ua);
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          try (InputStream is = conn.getInputStream()) {
                              byte[] buf = new byte[8192]; int n;
                              while ((n = is.read(buf)) > 0) baos.write(buf, 0, n);
                          }
                          final String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                          final String fn64 = Base64.encodeToString(filename.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          runOnUiThread(() -> appWebView.evaluateJavascript(
                                  "window.__onNativeFileImport && window.__onNativeFileImport('" + fn64 + "','" + b64 + "');", null));
                      } catch (Exception e) {
                          runOnUiThread(() -> Toast.makeText(this, "İndirme hatası: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }).start();
              }

              private void loadInBrowser(String input) {
                  String q = input == null ? "" : input.trim();
                  if (q.isEmpty()) q = "https://www.google.com";
                  String url;
                  if (q.startsWith("http://") || q.startsWith("https://")) url = q;
                  else if (!q.contains(" ") && q.contains(".")) url = "https://" + q;
                  else { try { url = "https://www.google.com/search?q=" + URLEncoder.encode(q, "UTF-8"); } catch (Exception e) { url = "https://www.google.com"; } }
                  urlBar.setText(url);
                  browserWebView.loadUrl(url);
              }

              private void captureViewportForManga(final Rect crop) {
                  final int w = browserWebView.getWidth(), h = browserWebView.getHeight();
                  if (w <= 0 || h <= 0) return;
                  pendingCropRect = crop;
                  statusBar.setText(crop != null ? "✂️ Seçili alan taranıyor…" : "💬 Manga ekranı taranıyor…");
                  statusBar.setVisibility(View.VISIBLE);
                  browserWebView.evaluateJavascript(
                          "document.querySelectorAll('.cai-mb').forEach(function(e){e.style.visibility='hidden';});",
                          v -> new Handler(Looper.getMainLooper()).postDelayed(() -> doPixelCapture(w, h, crop), 80));
              }

              private void doPixelCapture(int w, int h, Rect crop) {
                  final Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      int[] loc = new int[2]; browserWebView.getLocationInWindow(loc);
                      Rect rect = new Rect(loc[0], loc[1], loc[0] + w, loc[1] + h);
                      try {
                          PixelCopy.request(getWindow(), rect, bmp, res -> {
                              restoreHiddenBubbles();
                              if (res == PixelCopy.SUCCESS) sendBitmapToMangaAI(bmp, crop);
                              else fallbackCanvasCapture(w, h, crop);
                          }, new Handler(Looper.getMainLooper()));
                      } catch (Exception e) { restoreHiddenBubbles(); fallbackCanvasCapture(w, h, crop); }
                  } else { restoreHiddenBubbles(); fallbackCanvasCapture(w, h, crop); }
              }

              private void fallbackCanvasCapture(int w, int h, Rect crop) {
                  try {
                      Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(bmp); c.translate(-browserWebView.getScrollX(), -browserWebView.getScrollY());
                      browserWebView.draw(c); sendBitmapToMangaAI(bmp, crop);
                  } catch (Exception e) { statusBar.setText("❌ Ekran yakalanamadı: " + e.getMessage()); }
              }

              private void restoreHiddenBubbles() {
                  browserWebView.evaluateJavascript("document.querySelectorAll('.cai-mb').forEach(function(e){e.style.visibility='visible';});", null);
              }

              private void sendBitmapToMangaAI(Bitmap bmp, Rect crop) {
                  try {
                      Bitmap target = bmp;
                      if (crop != null) {
                          int x = Math.max(0, Math.min(crop.left, bmp.getWidth() - 2));
                          int y = Math.max(0, Math.min(crop.top, bmp.getHeight() - 2));
                          int cw = Math.max(2, Math.min(crop.width(), bmp.getWidth() - x));
                          int ch = Math.max(2, Math.min(crop.height(), bmp.getHeight() - y));
                          target = Bitmap.createBitmap(bmp, x, y, cw, ch);
                      }
                      int maxW = 1080;
                      if (target.getWidth() > maxW) {
                          int nh = Math.round((float) target.getHeight() * maxW / target.getWidth());
                          target = Bitmap.createScaledBitmap(target, maxW, nh, true);
                      }
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      target.compress(Bitmap.CompressFormat.JPEG, 85, baos);
                      String b64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP);
                      appWebView.evaluateJavascript("window.__onNativeMangaCapture && window.__onNativeMangaCapture('" + b64 + "');", null);
                  } catch (Exception e) { statusBar.setText("❌ Görsel hatası: " + e.getMessage()); }
              }

              private void triggerPageExtract() {
                  String js = "(function(){"
                      + "if(!window.__caiState){window.__caiState={els:[],orig:[],tr:[]};}"
                      + "var st=window.__caiState;"
                      + "if(!st.els.length){"
                      + "  var skip={SCRIPT:1,STYLE:1,NOSCRIPT:1,SVG:1,NAV:1,HEADER:1,FOOTER:1,BUTTON:1,INPUT:1,TEXTAREA:1,SELECT:1};"
                      + "  var root=document.querySelector('article,main,[role=main],.chapter-content,.cha-words,#chapter-content,.entry-content')||document.body;"
                      + "  var nodes=root.querySelectorAll('p,h1,h2,h3,h4,li,blockquote');"
                      + "  if(nodes.length<3){nodes=document.body.querySelectorAll('p,h1,h2,h3,div');}"
                      + "  var seen=new Set();"
                      + "  for(var i=0;i<nodes.length;i++){"
                      + "    var el=nodes[i];"
                      + "    if(skip[el.tagName]||el.closest('nav,header,footer,script,style'))continue;"
                      + "    if(el.tagName==='DIV'&&el.querySelector('p,div'))continue;"
                      + "    var t=(el.innerText||'').replace(/\\s+/g,' ').trim();"
                      + "    if(t.length<4||seen.has(el))continue;"
                      + "    seen.add(el);var idx=st.els.length;el.setAttribute('data-cai-id',idx);"
                      + "    st.els.push(el);st.orig.push(el.innerHTML);st.tr.push('');"
                      + "  }"
                      + "}"
                      + "window.__caiSetMode=function(m){for(var i=0;i<st.els.length;i++){var el=st.els[i],tr=st.tr[i];if(!tr||m==='orig'){el.innerHTML=st.orig[i];}else if(m==='bi'){el.innerHTML='<div style=\"opacity:.65;font-size:.88em;margin-bottom:4px\">'+st.orig[i]+'</div><div>'+tr.replace(/</g,'&lt;').replace(/\\n/g,'<br>')+'</div>';}else{el.innerText=tr;}}};"
                      + "window.__caiApply=function(b64,m){try{var bin=atob(b64);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);var map=JSON.parse(new TextDecoder().decode(bytes));for(var k in map){var idx=Number(k);if(st.els[idx]){st.tr[idx]=map[k];}}window.__caiSetMode(m||'tr');}catch(e){}};"
                      + "var out=st.els.map(function(el,i){return {i:i,t:(el.innerText||'').replace(/\\s+/g,' ').trim()};});"
                      + "BrowserBridge.onPageExtracted(document.title||location.href, location.href, JSON.stringify(out));"
                      + "})();";
                  browserWebView.evaluateJavascript(js, null);
              }

              private class AppBridge {
                  @JavascriptInterface public boolean isNative() { return true; }

                  @JavascriptInterface
                  public void openBrowser(final String urlOrQuery) {
                      runOnUiThread(() -> {
                          browserRoot.setVisibility(View.VISIBLE);
                          statusBar.setVisibility(View.GONE);
                          curTransMode = "tr"; modeBtn.setText("Çeviri");
                          loadInBrowser(urlOrQuery);
                      });
                  }

                  @JavascriptInterface
                  public void setBrowserStatus(final String msg) {
                      runOnUiThread(() -> {
                          if (msg == null || msg.isEmpty()) statusBar.setVisibility(View.GONE);
                          else { statusBar.setText(msg); statusBar.setVisibility(View.VISIBLE); }
                      });
                  }

                  @JavascriptInterface
                  public void setKeepScreenOn(final boolean on) {
                      runOnUiThread(() -> {
                          if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      });
                  }

                  @JavascriptInterface
                  public void syncConfig(final String jsonCfg) {
                      try {
                          JSONObject j = new JSONObject(jsonCfg);
                          SharedPreferences.Editor ed = getSharedPreferences("cai_cfg", MODE_PRIVATE).edit();
                          ed.putString("apiKey", j.optString("apiKey", ""));
                          ed.putString("baseUrl", j.optString("baseUrl", "https://api.literouter.com/v1"));
                          ed.putString("model", j.optString("model", ""));
                          ed.putString("tgtLang", j.optString("tgtLang", "Türkçe"));
                          ed.apply();
                          mangaFontStyle = j.optString("mangaFont", "system-ui,sans-serif");
                          mangaFontScale = (float) j.optDouble("mangaFontScale", 1.0);
                          mangaBgAlpha = (float) j.optDouble("mangaBgAlpha", 0.95);
                          mangaBorderHex = j.optString("mangaBorder", "#8b5cf6");
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void startFloatingOverlay() {
                      runOnUiThread(() -> {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(MainActivity.this)) {
                              Toast.makeText(MainActivity.this, "Lütfen 'Diğer uygulamaların üzerinde göster' iznini aç.", Toast.LENGTH_LONG).show();
                              startActivityForResult(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + getPackageName())), OVERLAY_REQ);
                              return;
                          }
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          startActivityForResult(mpm.createScreenCaptureIntent(), PROJ_REQ);
                      });
                  }

                  @JavascriptInterface
                  public void stopFloatingOverlay() {
                      runOnUiThread(() -> {
                          Intent i = new Intent(MainActivity.this, OverlayService.class);
                          i.setAction("STOP");
                          startService(i);
                      });
                  }

                  @JavascriptInterface
                  public void applyPageTranslations(final String jsonMap) {
                      runOnUiThread(() -> {
                          String b64 = Base64.encodeToString(jsonMap.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          browserWebView.evaluateJavascript("window.__caiApply && window.__caiApply('" + b64 + "','" + curTransMode + "');", null);
                      });
                  }

                  @JavascriptInterface
                  public void showQuickSelectResult(final String text) {
                      runOnUiThread(() -> {
                          String b64 = Base64.encodeToString((text == null ? "" : text).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          browserWebView.evaluateJavascript("window.__caiShowQuickTrans && window.__caiShowQuickTrans('" + b64 + "');", null);
                      });
                  }

                  @JavascriptInterface
                  public void applyMangaBubbles(final String jsonBubbles) {
                      runOnUiThread(() -> {
                          String b64 = Base64.encodeToString(jsonBubbles.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          float oxPct = 0f, oyPct = 0f, owPct = 100f, ohPct = 100f;
                          if (pendingCropRect != null && browserWebView.getWidth() > 0 && browserWebView.getHeight() > 0) {
                              oxPct = (float) pendingCropRect.left / browserWebView.getWidth() * 100f;
                              oyPct = (float) pendingCropRect.top / browserWebView.getHeight() * 100f;
                              owPct = (float) pendingCropRect.width() / browserWebView.getWidth() * 100f;
                              ohPct = (float) pendingCropRect.height() / browserWebView.getHeight() * 100f;
                          }
                          pendingCropRect = null;
                          String js = "(function(){try{"
                              + "var bin=atob('" + b64 + "');var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);"
                              + "var arr=JSON.parse(new TextDecoder().decode(bytes));"
                              + "var sy=window.scrollY||document.documentElement.scrollTop||0, sx=window.scrollX||document.documentElement.scrollLeft||0;"
                              + "var vw=window.innerWidth||document.documentElement.clientWidth, vh=window.innerHeight||document.documentElement.clientHeight;"
                              + "var ox=" + oxPct + "/100*vw, oy=" + oyPct + "/100*vh, ow=" + owPct + "/100*vw, oh=" + ohPct + "/100*vh;"
                              + "var layer=document.getElementById('cai-manga-layer');"
                              + "if(!layer){layer=document.createElement('div');layer.id='cai-manga-layer';layer.style.cssText='position:absolute;top:0;left:0;width:100%;height:0;pointer-events:none;z-index:2147483640;';document.body.appendChild(layer);}"
                              + "arr.forEach(function(b){"
                              + "  var d=document.createElement('div');d.className='cai-mb';"
                              + "  var bx=sx+ox+(b.x/100)*ow, by=sy+oy+(b.y/100)*oh, bw=Math.max(70,(b.w/100)*ow), bh=Math.max((b.h/100)*oh,28);"
                              + "  var fs=Math.max(10,Math.min(20,Math.round(bw*0.13*" + mangaFontScale + ")));"
                              + "  var bg='rgba(255,255,255," + mangaBgAlpha + ")', fg='#110b1c', bd='2px solid " + mangaBorderHex + "', rad='12px';"
                              + "  if(b.type==='narration'){bg='rgba(17,11,28," + mangaBgAlpha + ")';fg='#f4eeff';bd='2px solid #c084fc';rad='5px';}"
                              + "  else if(b.type==='sfx'){bg='rgba(217,70,239," + mangaBgAlpha + ")';fg='#ffffff';bd='2px solid #fff';rad='8px';}"
                              + "  else if(b.type==='thought'){bg='rgba(246,240,255," + mangaBgAlpha + ")';bd='2px dashed #a855f7';rad='18px';}"
                              + "  d.style.cssText='position:absolute;left:'+bx+'px;top:'+by+'px;width:'+bw+'px;min-height:'+bh+'px;background:'+bg+';color:'+fg+';border:'+bd+';border-radius:'+rad+';padding:4px 6px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;font:700 '+fs+'px/1.22 " + mangaFontStyle + ";box-shadow:0 4px 14px rgba(0,0,0,0.45);pointer-events:auto;word-break:break-word;';"
                              + "  d.textContent=b.tr; d.onclick=function(){this.style.opacity=this.style.opacity==='0.15'?'1':'0.15';};"
                              + "  layer.appendChild(d);"
                              + "});}catch(e){}})();";
                          browserWebView.evaluateJavascript(js, null);
                      });
                  }

                  @JavascriptInterface
                  public void saveFile(final String filename, final String base64Data, final String mimeType) {
                      runOnUiThread(() -> {
                          try {
                              byte[] bytes = Base64.decode(base64Data, Base64.DEFAULT);
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  ContentValues cv = new ContentValues();
                                  cv.put(MediaStore.Downloads.DISPLAY_NAME, filename);
                                  cv.put(MediaStore.Downloads.MIME_TYPE, mimeType);
                                  cv.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                  Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                                  if (uri != null) try (OutputStream os = getContentResolver().openOutputStream(uri)) { os.write(bytes); }
                              } else {
                                  File f = new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), filename);
                                  try (FileOutputStream fos = new FileOutputStream(f)) { fos.write(bytes); }
                              }
                              Toast.makeText(MainActivity.this, "İndirildi: " + filename, Toast.LENGTH_LONG).show();
                          } catch (Exception e) { Toast.makeText(MainActivity.this, "Hata: " + e.getMessage(), Toast.LENGTH_LONG).show(); }
                      });
                  }
              }

              private class BrowserBridge {
                  @JavascriptInterface
                  public void onPageExtracted(final String title, final String url, final String jsonBlocks) {
                      runOnUiThread(() -> {
                          String t64 = Base64.encodeToString((title == null ? "" : title).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          String u64 = Base64.encodeToString((url == null ? "" : url).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          String b64 = Base64.encodeToString((jsonBlocks == null ? "[]" : jsonBlocks).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          appWebView.evaluateJavascript("window.__onNativePageExtract && window.__onNativePageExtract('" + t64 + "','" + u64 + "','" + b64 + "');", null);
                      });
                  }
                  @JavascriptInterface
                  public void onQuickSelect(final String text) {
                      runOnUiThread(() -> {
                          String b64 = Base64.encodeToString((text == null ? "" : text).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          appWebView.evaluateJavascript("window.__onNativeQuickSelect && window.__onNativeQuickSelect('" + b64 + "');", null);
                      });
                  }
                  @JavascriptInterface
                  public void onAutoMangaScrollStop() {
                      runOnUiThread(() -> { if (optAutoManga) captureViewportForManga(null); });
                  }
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && filePathCallback != null) {
                      Uri[] results = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount(); results = new Uri[n];
                              for (int i = 0; i < n; i++) results[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) results = new Uri[]{ data.getData() };
                      }
                      filePathCallback.onReceiveValue(results); filePathCallback = null;
                  } else if (req == OVERLAY_REQ) {
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)) {
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          startActivityForResult(mpm.createScreenCaptureIntent(), PROJ_REQ);
                      }
                  } else if (req == PROJ_REQ && res == RESULT_OK && data != null) {
                      Intent svc = new Intent(this, OverlayService.class);
                      svc.putExtra("code", res); svc.putExtra("data", data);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc);
                      else startService(svc);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (regionView != null) { browserRoot.removeView(regionView); regionView = null; return; }
                  if (browserRoot.getVisibility() == View.VISIBLE) {
                      if (browserWebView.canGoBack()) browserWebView.goBack();
                      else browserRoot.setVisibility(View.GONE);
                      return;
                  }
                  if (appWebView.canGoBack()) { appWebView.goBack(); return; }
                  super.onBackPressed();
              }
          }
