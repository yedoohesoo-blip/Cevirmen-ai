          cat << 'EOF' > android_app/app/src/main/java/com/cevirmen/ai/MediaPlaybackService.java
          package com.cevirmen.ai;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          public class MediaPlaybackService extends Service {
              @Override public IBinder onBind(Intent intent) { return null; }
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  String act = intent != null ? intent.getAction() : null;
                  if ("STOP".equals(act)) { MainActivity.dispatchMediaAction("stop"); stopForeground(true); stopSelf(); return START_NOT_STICKY; }
                  if ("TOGGLE".equals(act)) { MainActivity.dispatchMediaAction("toggle"); return START_STICKY; }
                  if ("NEXT".equals(act)) { MainActivity.dispatchMediaAction("next"); return START_STICKY; }
                  if ("PREV".equals(act)) { MainActivity.dispatchMediaAction("prev"); return START_STICKY; }

                  String title = intent != null && intent.getStringExtra("title") != null ? intent.getStringExtra("title") : "Çevirmen AI Sesli Kitap";
                  String sub = intent != null && intent.getStringExtra("sub") != null ? intent.getStringExtra("sub") : "Sesli okuma aktif";
                  try {
                      String chId = "cai_media_ch";
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(new NotificationChannel(chId, "Sesli Kitap Kontrolü", NotificationManager.IMPORTANCE_LOW));
                      }
                      int pf = Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE) : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pPrev = PendingIntent.getService(this, 301, new Intent(this, MediaPlaybackService.class).setAction("PREV"), pf);
                      PendingIntent pTog = PendingIntent.getService(this, 302, new Intent(this, MediaPlaybackService.class).setAction("TOGGLE"), pf);
                      PendingIntent pNext = PendingIntent.getService(this, 303, new Intent(this, MediaPlaybackService.class).setAction("NEXT"), pf);
                      PendingIntent pStop = PendingIntent.getService(this, 304, new Intent(this, MediaPlaybackService.class).setAction("STOP"), pf);
                      Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(this, chId) : new Notification.Builder(this);
                      Notification n = nb.setContentTitle(title).setContentText(sub).setSmallIcon(R.drawable.ic_launcher)
                          .addAction(android.R.drawable.ic_media_previous, "Önceki", pPrev)
                          .addAction(android.R.drawable.ic_media_pause, "Duraklat", pTog)
                          .addAction(android.R.drawable.ic_media_next, "Sonraki", pNext)
                          .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Kapat", pStop)
                          .setOngoing(true).build();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) startForeground(103, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      else startForeground(103, n);
                  } catch (Throwable ignored) {}
                  return START_STICKY;
              }
          }
