                              + "  var sp=document.createElement('span');sp.className='cai-mb-t';sp.textContent=b.tr;d.appendChild(sp);"
                              + "  var tag=document.createElement('span');tag.textContent=isTr?'" + tgtLangCode + "':'ORİJ';tag.style.cssText='position:absolute;bottom:-8px;left:6px;font:800 8.5px/1 system-ui;padding:2px 5px;border-radius:999px;background:'+(isTr?'#8b5cf6':'#f59e0b')+';color:'+(isTr?'#fff':'#111')+';box-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none;';d.appendChild(tag);"
                              + "  var rt=document.createElement('button');rt.textContent='↻';rt.style.cssText='position:absolute;top:-9px;right:15px;width:20px;height:20px;border-radius:50%;border:none;background:#8b5cf6;color:#fff;font-size:11px;line-height:20px;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);';"
