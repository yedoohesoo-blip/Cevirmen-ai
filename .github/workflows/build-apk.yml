                  @JavascriptInterface public void fetchUrlInfo(final String reqId, final String targetUrl) {
                      new Thread(() -> {
                          JSONObject res = new JSONObject();
                          try {
                              HttpURLConnection conn = (HttpURLConnection) new URL(targetUrl).openConnection();
                              conn.setInstanceFollowRedirects(true);
                              conn.setRequestProperty("User-Agent", mobileUA);
                              conn.setRequestProperty("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8");
                              conn.setRequestProperty("Accept-Language", "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7");
                              conn.setRequestProperty("Referer", targetUrl);
                              String ck = CookieManager.getInstance().getCookie(targetUrl); if (ck != null) conn.setRequestProperty("Cookie", ck);
                              conn.setConnectTimeout(12000); conn.setReadTimeout(16000);
                              int code = conn.getResponseCode(); res.put("status", code); res.put("finalUrl", conn.getURL().toString());
                              InputStream is = code >= 200 && code < 400 ? conn.getInputStream() : conn.getErrorStream();
                              StringBuilder sb = new StringBuilder();
                              if (is != null) { BufferedReader br = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8)); String line; while ((line = br.readLine()) != null && sb.length() < 350000) sb.append(line).append('\n'); }
                              String html = sb.toString();
                              boolean cf = code == 403 || code == 503 || html.contains("cf-browser-verification") || html.contains("Just a moment...") || html.contains("Checking your browser");
                              res.put("protected", cf); res.put("html", html);
                          } catch (Throwable e) { try { res.put("status", 0); res.put("error", e.getMessage()); res.put("html", ""); } catch (Exception ignored) {} }
                          final String b64 = Base64.encodeToString(res.toString().getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          runOnUiThread(() -> appWebView.evaluateJavascript("window.__onNativeFetchInfoDone && window.__onNativeFetchInfoDone('" + reqId + "','" + b64 + "');", null));
                      }).start();
                  }

