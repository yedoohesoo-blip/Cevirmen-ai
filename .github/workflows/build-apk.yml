                      + "var seriesEl=document.querySelector('.novel-title,.book-title,.breadcrumb a:nth-of-type(2),a[href*=\"/novel/\"],a[href*=\"/series/\"]');"
                      + "var seriesTitle=(seriesEl && seriesEl!==h1El ? (seriesEl.innerText||'') : '').replace(/\\s+/g,' ').trim();"
