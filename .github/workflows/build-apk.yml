                  @JavascriptInterface public void applyMangaBubbles(final String jsonBubbles) {
                      runOnUiThread(() -> {
                          String enriched = enrichBubblesWithColors(jsonBubbles);
                          String b64 = Base64.encodeToString(enriched.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          float oxPct = 0f, oyPct = 0f, owPct = 100f, ohPct = 100f;
                          if (pendingCropRect != null && browserWebView.getWidth() > 0 && browserWebView.getHeight() > 0) {
                              oxPct = (float) pendingCropRect.left / browserWebView.getWidth() * 100f;
                              oyPct = (float) pendingCropRect.top / browserWebView.getHeight() * 100f;
                              owPct = (float) pendingCropRect.width() / browserWebView.getWidth() * 100f;
                              ohPct = (float) pendingCropRect.height() / browserWebView.getHeight() * 100f;
                          }
                          pendingCropRect = null;
                          String js = "(function(){try{"
                              + "var bin=atob('" + b64 + "');var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);"
                              + "var arr=JSON.parse(new TextDecoder().decode(bytes));"
                              + "var sy=window.scrollY||document.documentElement.scrollTop||0, sx=window.scrollX||document.documentElement.scrollLeft||0;"
                              + "var vw=window.innerWidth||document.documentElement.clientWidth, vh=window.innerHeight||document.documentElement.clientHeight;"
                              + "var ox=" + oxPct + "/100*vw, oy=" + oyPct + "/100*vh, ow=" + owPct + "/100*vw, oh=" + ohPct + "/100*vh;"
                              + "var layer=document.getElementById('cai-manga-layer');"
                              + "if(!layer){layer=document.createElement('div');layer.id='cai-manga-layer';layer.style.cssText='position:absolute;top:0;left:0;width:100%;height:0;pointer-events:none;z-index:2147483640;';document.body.appendChild(layer);}"
                              + "arr.forEach(function(b,idx){"
                              + "  var bid='caimb_'+Date.now()+'_'+idx; var d=document.createElement('div'); d.id=bid; d.className='cai-mb';"
                              + "  var bx=sx+ox+(b.x/100)*ow, by=sy+oy+(b.y/100)*oh, bw=Math.max(72,(b.w/100)*ow), bh=Math.max((b.h/100)*oh,30);"
                              + "  var len=Math.max(6,(b.tr||'').length); var areaFs=Math.sqrt((bw*bh)/len)*0.95;"
                              + "  var fs=Math.max(10,Math.min(18,Math.round(areaFs*" + mangaFontScale + ")));"
                              + "  var bg=b.bg||'rgba(255,255,255,0.97)', fg=b.fg||'#090612', bd='2px solid '+(b.bd||'" + mangaBorderHex + "'), rad='14px';"
                              + "  if(b.type==='narration'){bg='rgba(14,9,24,0.96)';fg='#ffffff';rad='5px';bd='2px solid #c084fc';}"
                              + "  else if(b.type==='sfx'){bg='rgba(192,38,211,0.95)';fg='#ffffff';bd='2px solid #ffffff';rad='8px';}"
                              + "  else if(b.type==='thought'){bd='2px dashed #a855f7';rad='20px';}"
                              + "  d.style.cssText='position:absolute;left:'+bx+'px;top:'+by+'px;width:'+bw+'px;min-height:'+bh+'px;background:'+bg+';color:'+fg+';border:'+bd+';border-radius:'+rad+';padding:5px 7px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;font:700 '+fs+'px/1.22 " + mangaFontStyle + ";box-shadow:0 4px 16px rgba(0,0,0,0.55);pointer-events:auto;word-break:break-word;';"
                              + "  var sp=document.createElement('span');sp.className='cai-mb-t';sp.textContent=b.tr;d.appendChild(sp);"
                              + "  var rt=document.createElement('button');rt.textContent='↻';"
                              + "  rt.style.cssText='position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;border:none;background:#8b5cf6;color:#fff;font-size:11px;line-height:20px;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);';"
                              + "  rt.onclick=function(ev){ev.stopPropagation();sp.textContent='⏳…';BrowserBridge.onRetranslateBubble(bid,b.orig||b.tr,b.tr);};"
                              + "  d.appendChild(rt);"
                              + "  d.onclick=function(){this.style.opacity=this.style.opacity==='0.15'?'1':'0.15';};"
                              + "  layer.appendChild(d);"
                              + "});}catch(e){}})();";
                          browserWebView.evaluateJavascript(js, null);
                      });
                  }
                  @JavascriptInterface public void saveFile(final String filename, final String base64Data, final String mimeType) {
                      runOnUiThread(() -> saveBytesToDownloads(filename, Base64.decode(base64Data, Base64.DEFAULT), mimeType));
                  }
              }

              private class BrowserBridge {
                  @JavascriptInterface public void onPageExtracted(final String title, final String url, final String cover, final String jsonBlocks) {
                      runOnUiThread(() -> {
                          String t64 = Base64.encodeToString((title == null ? "" : title).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          String u64 = Base64.encodeToString((url == null ? "" : url).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          String c64 = Base64.encodeToString((cover == null ? "" : cover).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          String b64 = Base64.encodeToString((jsonBlocks == null ? "[]" : jsonBlocks).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          appWebView.evaluateJavascript("window.__onNativePageExtract && window.__onNativePageExtract('" + t64 + "','" + u64 + "','" + c64 + "','" + b64 + "');", null);
                      });
                  }
                  @JavascriptInterface public void onQuickSelect(final String text) {
                      runOnUiThread(() -> {
                          String b64 = Base64.encodeToString((text == null ? "" : text).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          appWebView.evaluateJavascript("window.__onNativeQuickSelect && window.__onNativeQuickSelect('" + b64 + "');", null);
                      });
                  }
                  @JavascriptInterface public void onRetranslateBubble(final String id, final String orig, final String prevTr) {
                      runOnUiThread(() -> {
                          String o64 = Base64.encodeToString((orig == null ? "" : orig).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          String p64 = Base64.encodeToString((prevTr == null ? "" : prevTr).getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);
                          appWebView.evaluateJavascript("window.__onNativeRetranslateBubble && window.__onNativeRetranslateBubble('" + id + "','" + o64 + "','" + p64 + "');", null);
                      });
                  }
                  @JavascriptInterface public void onAutoMangaScrollStop() {
                      runOnUiThread(() -> { if (optAutoManga) captureViewportForManga(null, false); });
                  }
              }

              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && filePathCallback != null) {
                      Uri[] results = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount(); results = new Uri[n];
                              for (int i = 0; i < n; i++) results[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) results = new Uri[]{ data.getData() };
                      }
                      filePathCallback.onReceiveValue(results); filePathCallback = null;
                  } else if (req == OVERLAY_REQ) {
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)) {
                          MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          startActivityForResult(mpm.createScreenCaptureIntent(), PROJ_REQ);
                      }
                  } else if (req == PROJ_REQ && res == RESULT_OK && data != null) {
                      Intent svc = new Intent(this, OverlayService.class); svc.putExtra("code", res); svc.putExtra("data", data);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(svc); else startService(svc);
                  }
              }

              @Override public void onBackPressed() {
                  if (regionView != null) { browserRoot.removeView(regionView); regionView = null; return; }
                  if (browserRoot.getVisibility() == View.VISIBLE) {
                      if (browserWebView.canGoBack()) browserWebView.goBack(); else browserRoot.setVisibility(View.GONE);
                      return;
                  }
                  if (appWebView.canGoBack()) { appWebView.goBack(); return; }
                  super.onBackPressed();
              }
          }
